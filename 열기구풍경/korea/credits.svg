<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><title>Korea from above, credits</title>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{text-anchor:middle;opacity:0;animation:fi 1s ease-out both}@keyframes fi{from{opacity:0}to{opacity:1}}.all{animation:out 1s linear 11s both}@keyframes out{from{opacity:1}to{opacity:0}}</style></defs>
<rect width="1920" height="1080" fill="#05060d"/><g filter="url(#glow)" class="all"><text class="t" fill="none" stroke="#35f3ff" stroke-width="1.8" x="960" y="300" font-size="90" letter-spacing="22" font-family="'Helvetica Neue', Arial, sans-serif" style="animation-delay:0.2s">CREDITS</text><text class="t" fill="none" stroke="#ff4fd8" stroke-width="1.8" x="960" y="430" font-size="40" letter-spacing="8" font-family="'Helvetica Neue', Arial, sans-serif" style="animation-delay:1.0s">KOREA FROM ABOVE — LASER LINE ART</text><text class="t" fill="none" stroke="#ffb03a" stroke-width="1.8" x="960" y="580" font-size="56" letter-spacing="14" font-family="'Helvetica Neue', Arial, sans-serif" style="animation-delay:2.2s">ElevenSeoul</text><text class="t" fill="none" stroke="#39ff9c" stroke-width="1.8" x="960" y="660" font-size="44" letter-spacing="14" font-family="'Helvetica Neue', Arial, sans-serif" style="animation-delay:3.4s">Daesan Oh</text><text class="t" fill="none" stroke="#b78bff" stroke-width="1.8" x="960" y="780" font-size="36" letter-spacing="6" font-family="'Helvetica Neue', Arial, sans-serif" style="animation-delay:5.0s">Thank you for floating with us</text></g></svg>
