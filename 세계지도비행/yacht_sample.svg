<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Yacht sample</title>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw 1.4s cubic-bezier(.12,.7,.3,1) both}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.m{stroke:#ffd166}.p{stroke:#ff4fd8}
.drift{animation:drift 8s linear both}
@keyframes drift{from{transform:translate(-170px,0)}to{transform:translate(170px,0)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-4px) rotate(-2.2deg)}to{transform:translateY(4px) rotate(2.2deg)}}
.sea{opacity:.7;animation:fade 1.5s ease-out both}
.wake{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:0;animation:wake 3s ease-out 1.6s infinite}
@keyframes wake{0%{opacity:0;transform:translateX(0)}20%{opacity:.7}100%{opacity:0;transform:translateX(-34px)}}
.t{fill:none;stroke-width:1.6;text-anchor:middle;opacity:0;animation:fade .9s ease-out 2.4s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.star{fill:#a9bdff;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.55}}
</style>
</defs>
