<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Dolphin jump sample</title>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="above"><rect x="0" y="0" width="1920" height="640"/></clipPath>
<style>.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw 1.2s cubic-bezier(.12,.7,.3,1) both}@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}.sea{opacity:.7;animation:fade 1.5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.t{fill:none;stroke:#ff4fd8;stroke-width:1.6;text-anchor:middle;opacity:0;animation:fade .9s ease-out 2.4s both}.star{fill:#a9bdff;animation:tw 5s ease-in-out infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:.55}}.jump{animation:jumpA 2.4s linear both}.jump2{animation:jumpA 2.4s linear both}@keyframes jumpA{0%{transform:translate(-430px,120px) rotate(-56.1deg)}10%{transform:translate(-344px,5px) rotate(-50.0deg)}20%{transform:translate(-258px,-85px) rotate(-41.8deg)}30%{transform:translate(-172px,-149px) rotate(-30.8deg)}40%{transform:translate(-86px,-187px) rotate(-16.6deg)}50%{transform:translate(0px,-200px) rotate(0.0deg)}60%{transform:translate(86px,-187px) rotate(16.6deg)}70%{transform:translate(172px,-149px) rotate(30.8deg)}80%{transform:translate(258px,-85px) rotate(41.8deg)}90%{transform:translate(344px,5px) rotate(50.0deg)}100%{transform:translate(430px,120px) rotate(56.1deg)}}.rip{fill:none;stroke:#7ff0e0;stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 1.3s ease-out both}@keyframes rip{0%{opacity:0;transform:scale(.15)}15%{opacity:.8}100%{opacity:0;transform:scale(1)}}</style>
</defs>
<rect width="1920" height="1080" fill="#05060d"/>
<g filter="url(#glow)">
<g class="sea" fill="none" stroke="#4a66b0" stroke-width="2" stroke-linecap="round"><path d="M300 640 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M360 690 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M420 740 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>
<g><circle class="star" cx="420" cy="250" r="2" style="animation-delay:0.3s"/><circle class="star" cx="1500" cy="200" r="1.6" style="animation-delay:1.2s"/><circle class="star" cx="760" cy="150" r="1.4" style="animation-delay:2.1s"/><circle class="star" cx="1260" cy="300" r="2" style="animation-delay:0.8s"/><circle class="star" cx="1640" cy="420" r="1.5" style="animation-delay:1.7s"/><circle class="star" cx="260" cy="430" r="1.5" style="animation-delay:2.6s"/></g>
<g clip-path="url(#above)"><g transform="translate(960 640)"><g class="jump" style="animation-delay:1.4s"><g transform="scale(1.9)"><path class="d" pathLength="1" stroke="#7ff0e0" stroke-width="2.6" style="animation:none;stroke-dashoffset:0;opacity:1" d="M-62 6 C-46 -14 -10 -26 26 -20 C44 -17 54 -10 66 -8 L76 -4 L66 1 C54 5 44 7 30 11 C0 21 -30 19 -62 6 Z M-8 -23 Q-2 -42 16 -40 Q9 -32 11 -21 M-62 6 Q-76 -2 -86 -16 M-62 6 Q-76 14 -86 28 M22 9 Q12 26 -2 28 M44 -11 a2 2 0 1 0 .1 0"/></g></g></g><g transform="translate(960 640)"><g class="jump2" style="animation-delay:2.0s"><g transform="scale(1.45)"><path class="d" pathLength="1" stroke="#7ff0e0" stroke-width="2.6" style="animation:none;stroke-dashoffset:0;opacity:1" d="M-62 6 C-46 -14 -10 -26 26 -20 C44 -17 54 -10 66 -8 L76 -4 L66 1 C54 5 44 7 30 11 C0 21 -30 19 -62 6 Z M-8 -23 Q-2 -42 16 -40 Q9 -32 11 -21 M-62 6 Q-76 -2 -86 -16 M-62 6 Q-76 14 -86 28 M22 9 Q12 26 -2 28 M44 -11 a2 2 0 1 0 .1 0"/></g></g></g><g transform="translate(960 640)"><g class="jump" style="animation-delay:5.2s"><g transform="scale(1.9)"><path class="d" pathLength="1" stroke="#7ff0e0" stroke-width="2.6" style="animation:none;stroke-dashoffset:0;opacity:1" d="M-62 6 C-46 -14 -10 -26 26 -20 C44 -17 54 -10 66 -8 L76 -4 L66 1 C54 5 44 7 30 11 C0 21 -30 19 -62 6 Z M-8 -23 Q-2 -42 16 -40 Q9 -32 11 -21 M-62 6 Q-76 -2 -86 -16 M-62 6 Q-76 14 -86 28 M22 9 Q12 26 -2 28 M44 -11 a2 2 0 1 0 .1 0"/></g></g></g></g><ellipse class="rip" cx="614" cy="642" rx="80" ry="14" style="animation-delay:1.65s"/><ellipse class="rip" cx="1306" cy="642" rx="80" ry="14" style="animation-delay:3.55s"/><ellipse class="rip" cx="614" cy="642" rx="80" ry="14" style="animation-delay:2.25s"/><ellipse class="rip" cx="1306" cy="642" rx="80" ry="14" style="animation-delay:4.15s"/><ellipse class="rip" cx="614" cy="642" rx="80" ry="14" style="animation-delay:5.45s"/><ellipse class="rip" cx="1306" cy="642" rx="80" ry="14" style="animation-delay:7.35s"/>
<text class="t" x="960" y="860" font-size="30" letter-spacing="16" font-family="'Helvetica Neue', Arial, sans-serif">DOLPHIN</text>
</g>
