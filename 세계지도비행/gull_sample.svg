<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Seagull sample</title>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="above"><rect x="0" y="0" width="1920" height="640"/></clipPath>
<style>.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw 1.2s cubic-bezier(.12,.7,.3,1) both}@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}.sea{opacity:.7;animation:fade 1.5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.t{fill:none;stroke:#ff4fd8;stroke-width:1.6;text-anchor:middle;opacity:0;animation:fade .9s ease-out 2.4s both}.star{fill:#a9bdff;animation:tw 5s ease-in-out infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:.55}}.fl{fill:none;stroke:#eaf6ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:flap 1s ease-in-out infinite alternate}@keyframes flap{from{d:path("M-64 -2 Q-34 -30 0 -4 Q34 -30 64 -2")}to{d:path("M-64 16 Q-34 -6 0 -4 Q34 -6 64 16")}}.fly{animation:fly 9s linear both}@keyframes fly{from{transform:translateX(-260px)}to{transform:translateX(2200px)}}.bobg{animation:bobg 2.6s ease-in-out infinite alternate}@keyframes bobg{from{transform:translateY(-14px)}to{transform:translateY(14px)}}</style>
</defs>
<rect width="1920" height="1080" fill="#05060d"/>
<g filter="url(#glow)">
<g class="sea" fill="none" stroke="#4a66b0" stroke-width="2" stroke-linecap="round"><path d="M300 640 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M360 690 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M420 740 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>
<g><circle class="star" cx="420" cy="250" r="2" style="animation-delay:0.3s"/><circle class="star" cx="1500" cy="200" r="1.6" style="animation-delay:1.2s"/><circle class="star" cx="760" cy="150" r="1.4" style="animation-delay:2.1s"/><circle class="star" cx="1260" cy="300" r="2" style="animation-delay:0.8s"/><circle class="star" cx="1640" cy="420" r="1.5" style="animation-delay:1.7s"/><circle class="star" cx="260" cy="430" r="1.5" style="animation-delay:2.6s"/></g>
<path class="d" pathLength="1" stroke="#ffd166" stroke-width="2.6" style="animation-delay:.2s" d="M1560 640 L1572 440 H1608 L1620 640 M1566 520 H1614 M1570 470 H1610"/><path class="d" pathLength="1" stroke="#ffd166" stroke-width="2.6" style="animation-delay:.6s" d="M1566 440 L1590 400 L1612 440 M1590 400 V380 M1576 440 V418 H1604 V440"/><g transform="translate(0 430)"><g class="fly"><g class="bobg"><g transform="translate(0 0) scale(1.70)"><path class="fl" d="M-64 -2 Q-34 -30 0 -4 Q34 -30 64 -2" style="animation-delay:-0s"/></g><g transform="translate(-187 78) scale(1.36)"><path class="fl" d="M-64 -2 Q-34 -30 0 -4 Q34 -30 64 -2" style="animation-delay:-0.35s"/></g><g transform="translate(-340 -44) scale(1.10)"><path class="fl" d="M-64 -2 Q-34 -30 0 -4 Q34 -30 64 -2" style="animation-delay:-0.6s"/></g><g transform="translate(-510 51) scale(0.94)"><path class="fl" d="M-64 -2 Q-34 -30 0 -4 Q34 -30 64 -2" style="animation-delay:-0.15s"/></g></g></g></g>
<text class="t" x="960" y="860" font-size="30" letter-spacing="16" font-family="'Helvetica Neue', Arial, sans-serif">SEAGULL</text>
</g>
</svg>
