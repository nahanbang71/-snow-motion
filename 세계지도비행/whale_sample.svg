<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Whale spout sample</title>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="above"><rect x="0" y="0" width="1920" height="640"/></clipPath>
<style>.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw 1.2s cubic-bezier(.12,.7,.3,1) both}@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}.sea{opacity:.7;animation:fade 1.5s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.t{fill:none;stroke:#ff4fd8;stroke-width:1.6;text-anchor:middle;opacity:0;animation:fade .9s ease-out 2.4s both}.star{fill:#a9bdff;animation:tw 5s ease-in-out infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:.55}}.rise{animation:rise 5s ease-in-out infinite}@keyframes rise{0%{transform:translateY(100px)}16%{transform:translateY(0)}58%{transform:translateY(0)}78%{transform:translateY(100px)}100%{transform:translateY(100px)}}.sp{fill:none;stroke:#cfe3ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:spout 5s ease-out infinite}@keyframes spout{0%,15%{stroke-dashoffset:1;opacity:1}30%{stroke-dashoffset:0;opacity:1}52%{stroke-dashoffset:0;opacity:1}68%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}.dr{fill:none;stroke:#cfe3ff;stroke-width:2.4;opacity:0;animation:drop 5s ease-in infinite}@keyframes drop{0%,28%{opacity:0;transform:translateY(0)}34%{opacity:.9}62%{opacity:0;transform:translateY(90px)}100%{opacity:0}}.rip{fill:none;stroke:#6fa8ff;stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 5s ease-out infinite}@keyframes rip{0%,10%{opacity:0;transform:scale(.4)}22%{opacity:.8}60%{opacity:0;transform:scale(1.15)}100%{opacity:0}}</style>
</defs>
<rect width="1920" height="1080" fill="#05060d"/>
<g filter="url(#glow)">
