<g><circle class="star" cx="420" cy="250" r="2" style="animation-delay:0.3s"/><circle class="star" cx="1500" cy="200" r="1.6" style="animation-delay:1.2s"/><circle class="star" cx="760" cy="150" r="1.4" style="animation-delay:2.1s"/><circle class="star" cx="1260" cy="300" r="2" style="animation-delay:0.8s"/><circle class="star" cx="1640" cy="420" r="1.5" style="animation-delay:1.7s"/><circle class="star" cx="260" cy="430" r="1.5" style="animation-delay:2.6s"/></g>
<g transform="translate(960 640) scale(1.5)"><ellipse class="rip" cx="0" cy="3" rx="280" ry="16"/></g><g clip-path="url(#above)"><g transform="translate(960 640) scale(1.5)"><g class="rise"><path class="d" pathLength="1" stroke="#6fa8ff" stroke-width="2.8" style="animation:none;stroke-dashoffset:0;opacity:1" d="M-250 0 C-244 -34 -206 -58 -150 -68 C-70 -90 40 -82 120 -54 C170 -36 214 -16 250 0"/><path class="d" pathLength="1" stroke="#6fa8ff" stroke-width="2.8" style="animation:none;stroke-dashoffset:0;opacity:1" d="M96 -62 Q112 -96 134 -54"/><path class="d" pathLength="1" stroke="#6fa8ff" stroke-width="2.2" style="animation:none;stroke-dashoffset:0;opacity:1" d="M-112 -76 q8 -6 16 0 M-206 -34 a3 3 0 1 0 .1 0"/></g></g></g><g transform="translate(960 640) scale(1.5)"><g class="rise"><path class="sp" pathLength="1" d="M-92 -80 C-94 -140 -114 -184 -140 -204 M-92 -80 C-88 -140 -68 -184 -42 -204"/><circle class="dr" cx="-146" cy="-200" r="3" style="animation-delay:0s"/><circle class="dr" cx="-36" cy="-204" r="3" style="animation-delay:0.12s"/><circle class="dr" cx="-122" cy="-214" r="3" style="animation-delay:0.2s"/><circle class="dr" cx="-58" cy="-216" r="3" style="animation-delay:0.3s"/><circle class="dr" cx="-158" cy="-184" r="3" style="animation-delay:0.08s"/></g></g>
