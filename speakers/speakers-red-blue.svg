<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 900">
<style>
.beat{animation:beat .8s ease-out infinite}
.beat2{animation:beat2 .8s ease-out infinite}
.rip{opacity:0;animation:rip .8s ease-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--d)}
.bob{animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.tw{animation:tw 2s ease-in-out infinite;animation-delay:var(--d)}
.bounce{animation:bounce .8s ease-out infinite;animation-delay:var(--d)}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 20s linear infinite}
@keyframes beat{0%{transform:scale(1.12)}35%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes beat2{0%{transform:scale(1.35)}35%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes rip{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes bob{50%{transform:translateY(-22px)}}
@keyframes tw{50%{opacity:.55}}
@keyframes bounce{0%{transform:scale(1.05,.95)}35%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
<defs>
<radialGradient id="red" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ff3a30"/><stop offset=".5" stop-color="#d00808"/><stop offset="1" stop-color="#5a0000"/></radialGradient>
