<radialGradient id="dcap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4a4a4a"/><stop offset=".4" stop-color="#101010"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
