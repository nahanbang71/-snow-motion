<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<style>.r{animation:r 60s linear infinite}.k{animation:k 5s ease-in-out infinite;animation-delay:var(--d)}@keyframes r{to{transform:rotate(360deg)}}@keyframes k{50%{transform:translate(70px,40px)}}</style>
<defs><clipPath id="wc"><polygon points="0,0 1500,-200 1500,200"/></clipPath><g id="w"><g clip-path="url(#wc)"><circle class="k" style="--d:0.0s" cx="260" cy="-40" r="140" fill="#4a6fe0" opacity=".9"/><circle class="k" style="--d:-0.9s" cx="520" cy="60" r="110" fill="#3ab0f0" opacity=".9"/><circle class="k" style="--d:-1.8s" cx="800" cy="-30" r="170" fill="#8ae8c0" opacity=".9"/><circle class="k" style="--d:-2.7s" cx="1100" cy="70" r="120" fill="#f4a070" opacity=".9"/><circle class="k" style="--d:-3.6s" cx="380" cy="150" r="70" fill="#f080c0" opacity=".9"/><circle class="k" style="--d:-4.5s" cx="650" cy="170" r="90" fill="#e0d070" opacity=".9"/><circle class="k" style="--d:-5.4s" cx="950" cy="20" r="60" fill="#4a6fe0" opacity=".9"/><polygon points="0,0 1500,-190 1500,190" fill="#ffffff" opacity=".1"/></g></g><filter id="h" color-interpolation-filters="sRGB"><feColorMatrix type="hueRotate" values="0"><animate attributeName="values" from="0" to="360" dur="30s" repeatCount="indefinite"/></feColorMatrix></filter></defs>
<rect width="1920" height="1080" fill="#10102a"/>
<g filter="url(#h)"><g transform="translate(960 540)"><g class="r"><use href="#w" transform="rotate(0) scale(1 1)"/><use href="#w" transform="rotate(30) scale(1 -1)"/><use href="#w" transform="rotate(60) scale(1 1)"/><use href="#w" transform="rotate(90) scale(1 -1)"/><use href="#w" transform="rotate(120) scale(1 1)"/><use href="#w" transform="rotate(150) scale(1 -1)"/><use href="#w" transform="rotate(180) scale(1 1)"/><use href="#w" transform="rotate(210) scale(1 -1)"/><use href="#w" transform="rotate(240) scale(1 1)"/><use href="#w" transform="rotate(270) scale(1 -1)"/><use href="#w" transform="rotate(300) scale(1 1)"/><use href="#w" transform="rotate(330) scale(1 -1)"/></g></g></g>
</svg>
