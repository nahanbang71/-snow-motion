 CON.forEach((c,ci)=>{const t0=1.2+ci*7.4,pts=c.pts.map(([x,y])=>[W*c.x+x*c.k,H*c.y+y*c.k]);const n=c.edges.length,prog=clamp((t-t0)/5.2,0,1)*n;
  c.edges.forEach(([a,b],i)=>{const e=clamp(prog-i,0,1);if(e<=0)return;const[x1,y1]=pts[a],[x2,y2]=pts[b],ex=lerp(x1,x2,e),ey=lerp(y1,y2,e);ctx.strokeStyle='rgba(90,230,255,.85)';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex,ey);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.9;ctx.stroke();if(e<1)glow(ex,ey,18,'120,240,255',1)});
  pts.forEach(([x,y],i)=>{const reach=c.edges.some(([a,b],j)=>(a==i||b==i)&&prog>j);if(reach){const fl=clamp(1-(t-t0-i*.4)/1.2,0,1)*0+1;glow(x,y,26+6*Math.sin(t*2+i),'255,255,255',.55*fl);glow(x,y,70,'120,220,255',.2)}})});
 ctx.restore();ctx.globalCompositeOperation='source-over';ridge(H+40,90,19,.0046,'#010208',cam.x,.6,'rgba(110,150,230,.25)')}
const F12=new Stars(2200,121);
function scene12(t,p){const e=sm(p),z=lerp(1,1.2,e),hz=H*.68;const top=mix([4,8,28],[52,92,160],e),mid=mix([18,16,56],[255,140,120],e*e),hor=mix([28,22,70],[255,214,130],Math.pow(e,1.3));
 skyGrad([[0,top],[.5,mid],[.72,hor],[1,mix([8,8,24],[60,40,50],e)]]);
 ctx.save();ctx.translate(W/2,hz);ctx.scale(z,z);ctx.translate(-W/2,-hz);F12.draw(t,{x:0,y:0,z:1,rot:0},clamp(1-e*1.5,0,1)*.9,s=>s.y<hz+40);
 ctx.globalCompositeOperation='lighter';const sy=hz+lerp(60,-30,e);glow(W/2,sy,lerp(260,820,e),'255,190,110',.16+.5*e);glow(W/2,sy,lerp(60,200,e),'255,235,190',.2+.6*e);if(e>.55){const pr=sm((e-.55)/.45);ctx.globalAlpha=.9;ctx.fillStyle='#fff3d8';ctx.beginPath();ctx.arc(W/2,sy-pr*40,40+pr*22,0,6.283);ctx.fill();ctx.globalAlpha=1}
 ctx.globalCompositeOperation='source-over';
 ridge(hz+40,60,23,.006,mix([6,8,24],[90,60,70],e).map(v=>v).reduce((a,v,i)=>a+(i?',':'rgb(')+v,'')+')',0,0,null);ridge(hz+80,110,24,.004,'rgb('+mix([2,4,14],[44,34,52],e).join(',')+')',0,0,`rgba(255,200,150,${.4*e})`);
 ridge(hz+150,70,25,.007,'rgb('+mix([1,2,8],[26,20,34],e).join(',')+')',0,0,null);ctx.restore();
 if(e>.6){ctx.strokeStyle=`rgba(20,16,28,${clamp((e-.6)*3,0,1)})`;ctx.lineWidth=3;ctx.lineCap='round';for(let i=0;i<5;i++){const x=((t*(60+i*8)+i*300)%(W+200))-100,y=H*.3+i*34+10*Math.sin(t*3+i),w=7*Math.sin(t*8+i);ctx.beginPath();ctx.moveTo(x-16,y+w);ctx.quadraticCurveTo(x-6,y-6,x,y);ctx.quadraticCurveTo(x+6,y-6,x+16,y+w);ctx.stroke()}}}
const SCENES=[scene1,scene2,scene3,scene4,scene5,scene6,scene7,scene8,scene9,scene10,scene11,scene12];
let vig;function vignette(){if(!vig){vig=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.0);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.55)')}ctx.fillStyle=vig;ctx.fillRect(0,0,W,H)}
window.drawFrame=function(i,t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 SCENES[i](t,clamp(t/SCENE_LEN,0,1));vignette();const a=Math.min(i==0?1:clamp(t/FADE,0,1),clamp((SCENE_LEN-t)/FADE,0,1));if(a<1){ctx.fillStyle=`rgba(0,0,0,${1-a})`;ctx.fillRect(0,0,W,H)}};
