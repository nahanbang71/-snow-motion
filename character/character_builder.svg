<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<style>@keyframes bg{0%{fill:#d9d1c5}50%{fill:#d9d1c5}56%{fill:#e8863a}68%{fill:#e8863a}74%{fill:#1e7fe0}84%{fill:#1e7fe0}88%{fill:#8fc7c9}94%{fill:#8fc7c9}99%{fill:#d9d1c5}100%{fill:#d9d1c5}}@keyframes hood{0%{fill:#4a3b33}50%{fill:#4a3b33}56%{fill:#6a3a24}68%{fill:#6a3a24}74%{fill:#17407a}84%{fill:#17407a}88%{fill:#4a3b33}100%{fill:#4a3b33}}@keyframes head{0%{transform:scale(1)}15%{transform:scale(1)}22%{transform:scale(1.45)}34%{transform:scale(1.45)}41%{transform:scale(1)}80%{transform:scale(1)}85%{transform:scale(0.85)}90%{transform:scale(0.85)}96%{transform:scale(1)}100%{transform:scale(1)}}@keyframes tall{0%{transform:scale(1)}42%{transform:scale(1)}50%{transform:scale(1.12)}62%{transform:scale(1.12)}70%{transform:scale(1)}100%{transform:scale(1)}}@keyframes wide{0%{transform:scaleX(1)}62%{transform:scaleX(1)}68%{transform:scaleX(1.25)}78%{transform:scaleX(1.25)}84%{transform:scaleX(1)}100%{transform:scaleX(1)}}@keyframes k_head{0%{transform:translateX(85.8px)}15%{transform:translateX(85.8px)}22%{transform:translateX(215.8px)}34%{transform:translateX(215.8px)}41%{transform:translateX(85.8px)}80%{transform:translateX(85.8px)}85%{transform:translateX(44.2px)}90%{transform:translateX(44.2px)}96%{transform:translateX(85.8px)}100%{transform:translateX(85.8px)}}@keyframes k_body{0%{transform:translateX(85.8px)}62%{transform:translateX(85.8px)}68%{transform:translateX(195.0px)}78%{transform:translateX(195.0px)}84%{transform:translateX(85.8px)}100%{transform:translateX(85.8px)}}@keyframes k_tall{0%{transform:translateX(104.0px)}42%{transform:translateX(104.0px)}50%{transform:translateX(195.0px)}62%{transform:translateX(195.0px)}70%{transform:translateX(104.0px)}100%{transform:translateX(104.0px)}}@keyframes r_beige{0%{opacity:1}52%{opacity:1}56%{opacity:0}96%{opacity:0}99%{opacity:1}100%{opacity:1}}@keyframes r_orange{0%{opacity:0}55%{opacity:0}58%{opacity:1}70%{opacity:1}73%{opacity:0}100%{opacity:0}}@keyframes r_blue{0%{opacity:0}73%{opacity:0}76%{opacity:1}85%{opacity:1}87%{opacity:0}100%{opacity:0}}@keyframes r_teal{0%{opacity:0}87%{opacity:0}89%{opacity:1}95%{opacity:1}97%{opacity:0}100%{opacity:0}}@keyframes m_smile{0%{opacity:1}19%{opacity:1}21%{opacity:0}35%{opacity:0}37%{opacity:1}68%{opacity:1}70%{opacity:0}88%{opacity:0}90%{opacity:1}100%{opacity:1}}@keyframes m_puff{0%{opacity:0}19%{opacity:0}21%{opacity:1}35%{opacity:1}37%{opacity:0}100%{opacity:0}}@keyframes m_smirk{0%{opacity:0}68%{opacity:0}70%{opacity:1}88%{opacity:1}90%{opacity:0}100%{opacity:0}}@keyframes blush{0%{opacity:0.55}20%{opacity:0.55}24%{opacity:1}34%{opacity:1}40%{opacity:0.55}100%{opacity:0.55}}@keyframes arm{0%{transform:rotate(-8deg)}24%{transform:rotate(-8deg)}28%{transform:rotate(-125deg)}30%{transform:rotate(-105deg)}32%{transform:rotate(-125deg)}34%{transform:rotate(-105deg)}36%{transform:rotate(-125deg)}40%{transform:rotate(-8deg)}100%{transform:rotate(-8deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}@keyframes tilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@keyframes look{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.bg{animation:bg 20s linear infinite}.hood{animation:hood 20s linear infinite}.tall{transform-origin:400px 640px;animation:tall 20s ease-in-out infinite}.wide{transform-origin:400px 450px;animation:wide 20s ease-in-out infinite}.head{transform-origin:400px 300px;animation:head 20s ease-in-out infinite}.tilt{transform-origin:400px 300px;animation:tilt 4s ease-in-out infinite}.breathe{transform-origin:400px 640px;animation:breathe 3s ease-in-out infinite}.bob{animation:bob 3s ease-in-out infinite}.arm{transform-origin:480px 312px;animation:arm 20s ease-in-out infinite}.eye{transform-origin:0 0;animation:blink 4s ease-in-out infinite}.look{animation:look 6s ease-in-out infinite}.blush{animation:blush 20s ease-in-out infinite}.k_head{animation:k_head 20s ease-in-out infinite}.k_body{animation:k_body 20s ease-in-out infinite}.k_tall{animation:k_tall 20s ease-in-out infinite}.r_beige{animation:r_beige 20s linear infinite}.r_orange{animation:r_orange 20s linear infinite}.r_blue{animation:r_blue 20s linear infinite}.r_teal{animation:r_teal 20s linear infinite}.m_smile{animation:m_smile 20s linear infinite}.m_puff{animation:m_puff 20s linear infinite}.m_smirk{animation:m_smirk 20s linear infinite}text{font-family:Helvetica,Arial,sans-serif;fill:#3a3a3a}</style>
<defs><radialGradient id="floor" cx=".3" cy=".95" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect class="bg" width="1280" height="720" fill="#d9d1c5"/>
<rect width="1280" height="720" fill="url(#floor)"/>

<ellipse cx="400" cy="640" rx="130" ry="14" fill="#000" opacity=".18"/>
<g class="tall"><g class="breathe">
