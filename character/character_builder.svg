    <path d="M318 215c-4-70 40-104 82-104s86 34 82 104c4 40 0 80 10 96-24 14-52 8-62-14H370c-10 22-38 28-62 14 10-16 6-56 10-96z" fill="#3a2a24"/>
    <ellipse cx="400" cy="214" rx="74" ry="82" fill="#f3c8a8"/>
