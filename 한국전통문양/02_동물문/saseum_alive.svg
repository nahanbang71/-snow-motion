<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1920" height="1080"><title>Deer - alive</title><defs><radialGradient id="bg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient><clipPath id="clipc"><circle r="102"/></clipPath><filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.l{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
g[class^="a-"]{transform-origin:0 0}
.a-eye{transform-box:fill-box;transform-origin:center}
.a-fb{transform-box:fill-box;transform-origin:center}
.a-bob{animation:bob 2.6s ease-in-out infinite}
.a-breathe{animation:breathe 3.4s ease-in-out infinite}
