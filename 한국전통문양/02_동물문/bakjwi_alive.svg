.a-earr{animation:ear 4s infinite 1.6s}
@keyframes flap{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-20deg)}}
@keyframes bobb{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
