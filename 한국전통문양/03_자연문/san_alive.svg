<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1920" height="1080"><title>Mountains - alive</title><defs><radialGradient id="bg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#1a1450"/><stop offset="1" stop-color="#03040e"/></radialGradient><filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.l{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
g[class^="a-"]{transform-origin:0 0}
.a-eye{transform-box:fill-box;transform-origin:center}
.a-fb{transform-box:fill-box;transform-origin:center}
.a-bob{animation:bob 2.6s ease-in-out infinite}
.a-breathe{animation:breathe 3.4s ease-in-out infinite}
.a-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.a-glow{animation:glow 2.2s ease-in-out infinite alternate}
.a-glow2{animation:glow 3.1s ease-in-out infinite alternate}
.a-spin{animation:spin 6s linear infinite}
.a-spinr{animation:spinr 6s linear infinite}
.a-ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}
.fly{fill:var(--fly,#fff1c4);opacity:0;animation:twinkle 3s ease-in-out infinite}
.seed{opacity:1;animation:seed 1.6s ease-in forwards}
@keyframes seed{to{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
@keyframes glow{from{opacity:.45}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes ripple{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes twinkle{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.95;transform:translateY(-5px)}}
.scene{opacity:0;animation:fadein 1.6s ease-out forwards}@keyframes fadein{to{opacity:1}}
.a-star2{animation:tw3 2.8s ease-in-out infinite}
.a-sun{animation:spin 90s linear infinite}
.a-ridge{animation:ridge 14s ease-in-out infinite alternate}
.a-mist{animation:mist 12s linear infinite}
.a-bird{animation:bird 12s linear infinite;opacity:0}
.a-water{animation:water 4s linear infinite}
@keyframes tw3{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes ridge{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@keyframes mist{0%{transform:translateX(-160px);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateX(160px);opacity:0}}
@keyframes bird{0%{transform:translate(1600px,var(--y));opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(-100px,calc(var(--y) - 60px));opacity:0}}
