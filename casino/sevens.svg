<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<style>.drop{transform-box:fill-box;transform-origin:center bottom;transform:translateY(-600px);animation:drop .9s cubic-bezier(.3,1.6,.5,1) forwards,pulse 2.4s ease-in-out 1.5s infinite;animation-delay:var(--d),calc(var(--d) + 1.5s)}
.shine{animation:sh 2.4s ease-in-out infinite;animation-delay:calc(var(--sd) + 1.6s)}
@keyframes drop{to{transform:translateY(0)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}60%,100%{transform:translateX(480px) skewX(-20deg)}}</style>
<defs><linearGradient id="g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c8c8"/><stop offset=".3" stop-color="#d89090"/><stop offset=".42" stop-color="#ff1010"/><stop offset=".75" stop-color="#d00000"/><stop offset="1" stop-color="#800000"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c7"><path d="M0 0H290C300 20 260 90 230 160C200 230 180 330 175 420H60C62 330 85 240 125 165C140 135 135 112 110 112H0Z"/></clipPath>
<g id="s7"><path d="M0 0H290C300 20 260 90 230 160C200 230 180 330 175 420H60C62 330 85 240 125 165C140 135 135 112 110 112H0Z" fill="url(#g7)" stroke="#c88a2a" stroke-width="30" stroke-linejoin="round"/><path d="M0 0H290C300 20 260 90 230 160C200 230 180 330 175 420H60C62 330 85 240 125 165C140 135 135 112 110 112H0Z" fill="url(#g7)" stroke="#e8b050" stroke-width="12" stroke-linejoin="round"/><path d="M0 0H290C300 20 260 90 230 160C200 230 180 330 175 420H60C62 330 85 240 125 165C140 135 135 112 110 112H0Z" fill="none" stroke="#fff" stroke-width="5" transform="translate(150 210) scale(.92) translate(-150 -210)"/>
<g clip-path="url(#c7)"><rect class="shine" x="-120" y="-20" width="90" height="480" fill="url(#sh)" transform="skewX(-20)" style="--d:var(--sd)"/></g></g></defs>
<g transform="translate(30 95) scale(0.62)"><g class="drop" style="--d:0.3s;--sd:0.3s;opacity:0.8"><use href="#s7"/></g></g><g transform="translate(540 115) scale(0.64)"><g class="drop" style="--d:0.6s;--sd:0.6s;opacity:0.9"><use href="#s7"/></g></g><g transform="translate(210 10) scale(0.9)"><g class="drop" style="--d:0s;--sd:0s;opacity:1"><use href="#s7"/></g></g>
</svg>
