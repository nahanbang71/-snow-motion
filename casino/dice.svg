<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1375">
<style>.roll{transform-box:fill-box;transform-origin:center;animation:roll 2.4s ease-in-out infinite;animation-delay:var(--d)}
.pp{transform-box:fill-box;transform-origin:center;animation:pp 1.2s ease-in-out infinite;animation-delay:var(--d)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes roll{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-45px) rotate(-3deg)}70%{transform:translateY(0) rotate(1deg)}85%{transform:translateY(-10px)}}
@keyframes pp{50%{transform:scale(1.15)}}
@keyframes tw{0%,100%{transform:scale(.2) rotate(0);opacity:.3}50%{transform:scale(1.2) rotate(45deg);opacity:1}}</style>
<defs><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ee4a4a"/><stop offset="1" stop-color="#f48a8a"/></linearGradient>
<linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b01018"/><stop offset=".5" stop-color="#c8281f"/><stop offset="1" stop-color="#e03a2a"/></linearGradient>
<linearGradient id="l1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f48a8a"/><stop offset=".45" stop-color="#e82028"/><stop offset="1" stop-color="#a82028"/></linearGradient>
<linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8685a"/><stop offset=".5" stop-color="#d82028"/><stop offset="1" stop-color="#c01820"/></linearGradient>
<linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a0808"/><stop offset="1" stop-color="#d03020"/></linearGradient></defs>
