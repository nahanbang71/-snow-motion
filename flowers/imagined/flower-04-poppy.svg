<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
.pop{transform:scale(0);animation:pop .9s cubic-bezier(.2,1.4,.4,1) forwards}
.s{opacity:0;animation:fade .5s ease forwards}
.spin{animation:spin 50s linear infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.sway{transform-origin:256px 470px;animation:sw 4s ease-in-out 1.6s infinite}
@keyframes pop{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{50%{opacity:.25}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes sw{50%{transform:rotate(3deg)}}
</style>
