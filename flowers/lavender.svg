<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<title>Lavender - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1.2s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:#b48cff;stroke-width:2}
.pet2{stroke:#e2c8ff;stroke-width:1.6}
.title{font:600 54px 'Poppins','Helvetica Neue',Arial,sans-serif;fill:none;stroke:#c9a6ff;stroke-width:1.6;opacity:0;animation:fade 1s ease-out 4.2s forwards}
.sub{font:500 22px 'Poppins','Helvetica Neue',Arial,sans-serif;fill:#e6d6ff;opacity:0;animation:fade 1s ease-out 4.8s forwards}
.sp{fill:#d9bfff;opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
