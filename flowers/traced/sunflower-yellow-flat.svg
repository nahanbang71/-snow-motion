<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
.sway{transform-origin:256px 490px;animation:sway 5s ease-in-out infinite}
.grow{transform-origin:256px 490px;transform:scaleY(0);animation:grow .9s ease-out forwards}
.leaf{transform:scale(0);animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
.spin{animation:spin 40s linear infinite}
.p{transform:scale(0);animation:pop .9s cubic-bezier(.2,1.4,.4,1) forwards}
.c{transform:scale(0);animation:pop .8s cubic-bezier(.2,1.6,.4,1) forwards}
.s{opacity:0;animation:fade .5s ease forwards}
@keyframes pop{to{transform:scale(1)}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{50%{transform:rotate(2deg)}}
</style>
