<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
.all{transform-origin:256px 256px;animation:spin 24s linear infinite}
.b{transform-origin:256px 256px;animation:breathe 4s ease-in-out 2s infinite}
.p{transform-origin:256px 256px;transform:scale(0);animation:bloom 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
.v{opacity:0;animation:fade .8s ease forwards}
.c{transform-origin:256px 256px;transform:scale(0);animation:bloom .8s cubic-bezier(.2,1.6,.4,1) 1.4s forwards,pulse 2s ease-in-out 2.4s infinite}
@keyframes bloom{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
