<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1245">
<style>
.st{opacity:0;transform-box:fill-box;transform-origin:center;animation:on 1.1s ease-out forwards,pop .8s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:var(--d),var(--d)}
.ln{animation:breathe 3s ease-in-out infinite;animation-delay:calc(var(--d) + 1.5s)}
.fl{opacity:.22}
.orbit{transform-origin:640px 590px;animation:cw 36s linear 9.5s infinite}
.spinl{transform-origin:640px 590px;animation:ccw 14s linear 9.5s infinite}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
@keyframes on{0%{opacity:0}15%{opacity:1}25%{opacity:.3}40%{opacity:1}50%{opacity:.5}65%,100%{opacity:1}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes breathe{50%{opacity:.65}}
</style>
