<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff7eb6;--c2:#ffd1e6">
<title>Oriental Lily - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C232 457 218 353 223 265"/><path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M225 527 C216 483 195 444 175 412 C185 449 199 490 225 527Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M226 550 C262 497 279 437 290 384 C262 431 234 487 226 550Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M226 533 C217 472 187 419 158 376 C170 427 188 484 226 533Z"/><path class="d stem" pathLength="1" style="--s:2.00s;--t:1s" d="M229 553 C275 513 301 461 319 413 C283 449 246 495 229 553Z"/>

<g transform="translate(223 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(60.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(180.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.48s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(300.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-26 -23.4 -26 -54.6 0 -78 C26 -54.6 26 -23.4 0 0Z"/></g><g transform="rotate(30.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.72s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><g transform="rotate(90.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><g transform="rotate(150.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.88s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><g transform="rotate(210.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.96s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><g transform="rotate(270.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.04s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><g transform="rotate(330.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.12s;--t:0.7s" d="M0 0 C-18.2 -16.8 -18.2 -39.3 0 -56.2 C18.2 -39.3 18.2 -16.8 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:3.20s;--t:0.4s" d="M0 0 L14.0 -24.2"/><circle class="fi dotc" cx="14.0" cy="-24.2" r="2.4" style="--s:3.23s"/><path class="d pet2" pathLength="1" style="--s:3.25s;--t:0.4s" d="M0 0 L34.0 -0.0"/><circle class="fi dotc" cx="34.0" cy="-0.0" r="2.4" style="--s:3.28s"/><path class="d pet2" pathLength="1" style="--s:3.30s;--t:0.4s" d="M0 0 L14.0 24.2"/><circle class="fi dotc" cx="14.0" cy="24.2" r="2.4" style="--s:3.33s"/><path class="d pet2" pathLength="1" style="--s:3.35s;--t:0.4s" d="M0 0 L-17.0 29.4"/><circle class="fi dotc" cx="-17.0" cy="29.4" r="2.4" style="--s:3.38s"/><path class="d pet2" pathLength="1" style="--s:3.40s;--t:0.4s" d="M0 0 L-28.0 0.0"/><circle class="fi dotc" cx="-28.0" cy="0.0" r="2.4" style="--s:3.43s"/><path class="d pet2" pathLength="1" style="--s:3.45s;--t:0.4s" d="M0 0 L-17.0 -29.4"/><circle class="fi dotc" cx="-17.0" cy="-29.4" r="2.4" style="--s:3.48s"/></g></g>
<text class="title" x="360" y="270" font-size="46" style="--s:3.8s">Oriental Lily</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.8s">Majesty</text>
<circle class="sp" cx="415" cy="123" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="387" cy="508" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="504" cy="234" r="2.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="210" cy="206" r="2" style="animation-delay:1.5s"/>
