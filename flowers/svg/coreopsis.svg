4.2" r="1.3" style="--s:2.32s"/><circle class="fi dotc" cx="3.0" cy="3.9" r="1.3" style="--s:2.32s"/><circle class="fi dotc" cx="-5.5" cy="-1.0" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="5.2" cy="-3.3" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="-1.8" cy="6.5" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="-3.3" cy="-6.4" r="1.3" style="--s:2.34s"/><circle class="fi dotc" cx="7.2" cy="2.6" r="1.3" style="--s:2.34s"/><circle class="fi dotc" cx="-7.5" cy="3.1" r="1.3" style="--s:2.35s"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.4s">Coreopsis</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.4s">Cheerfulness</text>
