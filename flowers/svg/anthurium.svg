<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff3860;--c2:#ffb3c1">
<title>Anthurium - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 454 234 348 230 257"/>
<path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M230 480 C190 495 158 465 152 425 C192 422 226 440 230 480Z"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M230 440 C268 452 300 425 306 388 C266 388 234 404 230 440Z"/>

<g transform="translate(230 190) scale(1.2)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:1.4s" d="M0 60 C-72 18 -56 -56 0 -22 C56 -56 72 18 0 60Z"/><path class="d pet2" pathLength="1" style="--s:2.50s;--t:0.7s" d="M0 54 L0 -12"/><path class="d pet2" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 50 C-24 30 -31.200000000000003 0 -28.799999999999997 -20"/><path class="d pet2" pathLength="1" style="--s:2.70s;--t:0.7s" d="M0 50 C24 30 31.200000000000003 0 28.799999999999997 -20"/><path class="d pet2" pathLength="1" style="--s:2.80s;--t:1s" d="M0 20 C14 0 18 -30 10 -58"/><circle class="fi dotc" cx="0.0" cy="20.0" r="2" style="--s:3.20s"/><circle class="fi dotc" cx="1.2" cy="10.5" r="2" style="--s:3.24s"/><circle class="fi dotc" cx="3.1" cy="1.0" r="2" style="--s:3.28s"/><circle class="fi dotc" cx="5.6" cy="-8.5" r="2" style="--s:3.32s"/><circle class="fi dotc" cx="8.3" cy="-18.0" r="2" style="--s:3.36s"/><circle class="fi dotc" cx="11.1" cy="-27.5" r="2" style="--s:3.40s"/><circle class="fi dotc" cx="13.5" cy="-37.0" r="2" style="--s:3.44s"/><circle class="fi dotc" cx="15.1" cy="-46.5" r="2" style="--s:3.48s"/><circle class="fi dotc" cx="15.7" cy="-56.0" r="2" style="--s:3.52s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.9s">Anthurium</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.9s">Agony of the heart</text>
<circle class="sp" cx="322" cy="388" r="2.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="406" cy="206" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="653" cy="335" r="1.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="66" cy="325" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="126" cy="326" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="71" cy="175" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="635" cy="503" r="1.5" style="animation-delay:3.0s"/>
</svg>