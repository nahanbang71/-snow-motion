<circle class="sp" cx="623" cy="202" r="1.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="555" cy="376" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="149" cy="303" r="2.5" style="animation-delay:3.0s"/>
</svg>