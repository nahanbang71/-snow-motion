<g transform="translate(225 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-44 -6.6 -46.2 -42.9 -13.2 -62.7 C-4.4 -66 4.4 -66 13.2 -62.7 C46.2 -42.9 44 -6.6 0 0Z"/></g><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-44 -6.6 -46.2 -42.9 -13.2 -62.7 C-4.4 -66 4.4 -66 13.2 -62.7 C46.2 -42.9 44 -6.6 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-44 -6.6 -46.2 -42.9 -13.2 -62.7 C-4.4 -66 4.4 -66 13.2 -62.7 C46.2 -42.9 44 -6.6 0 0Z"/></g><g transform="rotate(60.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-29.0 -4.4 -30.5 -28.3 -8.7 -41.4 C-2.9 -43.6 2.9 -43.6 8.7 -41.4 C30.5 -28.3 29.0 -4.4 0 0Z"/></g><g transform="rotate(180.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.44s;--t:0.7s" d="M0 0 C-29.0 -4.4 -30.5 -28.3 -8.7 -41.4 C-2.9 -43.6 2.9 -43.6 8.7 -41.4 C30.5 -28.3 29.0 -4.4 0 0Z"/></g><g transform="rotate(300.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.52s;--t:0.7s" d="M0 0 C-29.0 -4.4 -30.5 -28.3 -8.7 -41.4 C-2.9 -43.6 2.9 -43.6 8.7 -41.4 C30.5 -28.3 29.0 -4.4 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.60s;--t:0.7s" d="M-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><circle class="fi dotc" cx="16.0" cy="0.0" r="1.8" style="--s:2.67s"/><circle class="fi dotc" cx="14.4" cy="6.9" r="1.8" style="--s:2.69s"/><circle class="fi dotc" cx="10.0" cy="12.5" r="1.8" style="--s:2.71s"/><circle class="fi dotc" cx="3.6" cy="15.6" r="1.8" style="--s:2.73s"/><circle class="fi dotc" cx="-3.6" cy="15.6" r="1.8" style="--s:2.75s"/><circle class="fi dotc" cx="-10.0" cy="12.5" r="1.8" style="--s:2.77s"/><circle class="fi dotc" cx="-14.4" cy="6.9" r="1.8" style="--s:2.79s"/><circle class="fi dotc" cx="-16.0" cy="0.0" r="1.8" style="--s:2.81s"/><circle class="fi dotc" cx="-14.4" cy="-6.9" r="1.8" style="--s:2.83s"/><circle class="fi dotc" cx="-10.0" cy="-12.5" r="1.8" style="--s:2.85s"/><circle class="fi dotc" cx="-3.6" cy="-15.6" r="1.8" style="--s:2.87s"/><circle class="fi dotc" cx="3.6" cy="-15.6" r="1.8" style="--s:2.89s"/><circle class="fi dotc" cx="10.0" cy="-12.5" r="1.8" style="--s:2.91s"/><circle class="fi dotc" cx="14.4" cy="-6.9" r="1.8" style="--s:2.93s"/></g></g>
<text class="title" x="360" y="270" font-size="46" style="--s:3.4s">Bougainvillea</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Passion</text>
