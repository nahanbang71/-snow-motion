<circle class="sp" cx="75" cy="442" r="2" style="animation-delay:0.5s"/>
<circle class="sp" cx="694" cy="298" r="2.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="347" cy="252" r="1.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="724" cy="459" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="123" cy="532" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="91" cy="177" r="2.5" style="animation-delay:3.0s"/>
</svg>