<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff7eb6;--c2:#ffd1e6">
<title>Pink Hibiscus - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C232 456 240 351 236 262"/><g transform="translate(231 522) rotate(-36)"><path class="d stem" pathLength="1" style="--s:0.52s;--t:0.9s" d="M0 0 C28 -30 74 -27 93 0 C74 27 28 30 0 0Z"/><path class="d pet2" pathLength="1" style="--s:0.82s;--t:0.5s" d="M0 0 L74 0"/></g><g transform="translate(232 498) rotate(-38)"><path class="d stem" pathLength="1" style="--s:0.66s;--t:0.9s" d="M0 0 C34 -22 90 -20 112 0 C90 20 34 22 0 0Z"/><path class="d pet2" pathLength="1" style="--s:0.96s;--t:0.5s" d="M0 0 L90 0"/></g><g transform="translate(233 467) rotate(-144)"><path class="d stem" pathLength="1" style="--s:0.84s;--t:0.9s" d="M0 0 C28 -24 75 -22 94 0 C75 22 28 24 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.14s;--t:0.5s" d="M0 0 L75 0"/></g>

<g transform="translate(236 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(72.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.15s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(144.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(216.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(288.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.4s" d="M0 0 L15.3 -21.0"/><path class="d pet2" pathLength="1" style="--s:2.78s;--t:0.4s" d="M0 0 L24.7 8.0"/><path class="d pet2" pathLength="1" style="--s:2.81s;--t:0.4s" d="M0 0 L0.0 26.0"/><path class="d pet2" pathLength="1" style="--s:2.84s;--t:0.4s" d="M0 0 L-24.7 8.0"/><path class="d pet2" pathLength="1" style="--s:2.87s;--t:0.4s" d="M0 0 L-15.3 -21.0"/><path class="d pet2" pathLength="1" style="--s:2.90s;--t:0.7s" d="M0 0 C3 -20 4 -34 5 -52"/><circle class="fi dotc" cx="12.0" cy="-52.0" r="2.2" style="--s:3.10s"/><circle class="fi dotc" cx="8.5" cy="-45.9" r="2.2" style="--s:3.13s"/><circle class="fi dotc" cx="1.5" cy="-46.0" r="2.2" style="--s:3.16s"/><circle class="fi dotc" cx="-2.0" cy="-52.1" r="2.2" style="--s:3.19s"/><circle class="fi dotc" cx="1.6" cy="-58.1" r="2.2" style="--s:3.22s"/><circle class="fi dotc" cx="8.6" cy="-58.0" r="2.2" style="--s:3.25s"/></g></g>
<text class="title" x="360" y="270" font-size="46" style="--s:3.6s">Pink Hibiscus</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.6s">Gentleness</text>
