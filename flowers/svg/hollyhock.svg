<g transform="translate(236 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(72.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.15s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(144.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(216.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><g transform="rotate(288.0) translate(0 -2)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-44 -7.0 -46.2 -45.5 -13.2 -66.5 C-4.4 -70 4.4 -70 13.2 -66.5 C46.2 -45.5 44 -7.0 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.4s" d="M0 0 L15.3 -21.0"/><path class="d pet2" pathLength="1" style="--s:2.78s;--t:0.4s" d="M0 0 L24.7 8.0"/><path class="d pet2" pathLength="1" style="--s:2.81s;--t:0.4s" d="M0 0 L0.0 26.0"/><path class="d pet2" pathLength="1" style="--s:2.84s;--t:0.4s" d="M0 0 L-24.7 8.0"/><path class="d pet2" pathLength="1" style="--s:2.87s;--t:0.4s" d="M0 0 L-15.3 -21.0"/><path class="d pet2" pathLength="1" style="--s:2.90s;--t:0.7s" d="M0 0 C3 -20 4 -34 5 -52"/><circle class="fi dotc" cx="12.0" cy="-52.0" r="2.2" style="--s:3.10s"/><circle class="fi dotc" cx="8.5" cy="-45.9" r="2.2" style="--s:3.13s"/><circle class="fi dotc" cx="1.5" cy="-46.0" r="2.2" style="--s:3.16s"/><circle class="fi dotc" cx="-2.0" cy="-52.1" r="2.2" style="--s:3.19s"/><circle class="fi dotc" cx="1.6" cy="-58.1" r="2.2" style="--s:3.22s"/><circle class="fi dotc" cx="8.6" cy="-58.0" r="2.2" style="--s:3.25s"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.6s">Hollyhock</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.6s">Abundance</text>
