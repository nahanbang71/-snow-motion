0 0 C-21.6 -12.1 -26.4 -33.9 -13.2 -48.4 L0 -40.6 L13.2 -48.4 C26.4 -33.9 21.6 -12.1 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.70s;--t:0.4s" d="M0 0 L2.8 -19.8"/><circle class="fi dotc" cx="2.8" cy="-19.8" r="2.2" style="--s:2.73s"/><path class="d pet2" pathLength="1" style="--s:2.74s;--t:0.4s" d="M0 0 L20.1 -20.9"/><circle class="fi dotc" cx="20.1" cy="-20.9" r="2.2" style="--s:2.77s"/><path class="d pet2" pathLength="1" style="--s:2.78s;--t:0.4s" d="M0 0 L19.7 -3.5"/><circle class="fi dotc" cx="19.7" cy="-3.5" r="2.2" style="--s:2.81s"/><path class="d pet2" pathLength="1" style="--s:2.82s;--t:0.4s" d="M0 0 L26.1 12.7"/><circle class="fi dotc" cx="26.1" cy="12.7" r="2.2" style="--s:2.85s"/><path class="d pet2" pathLength="1" style="--s:2.86s;--t:0.4s" d="M0 0 L9.4 17.7"/><circle class="fi dotc" cx="9.4" cy="17.7" r="2.2" style="--s:2.89s"/><path class="d pet2" pathLength="1" style="--s:2.90s;--t:0.4s" d="M0 0 L-4.0 28.7"/><circle class="fi dotc" cx="-4.0" cy="28.7" r="2.2" style="--s:2.93s"/><path class="d pet2" pathLength="1" style="--s:2.94s;--t:0.4s" d="M0 0 L-13.9 14.4"/><circle class="fi dotc" cx="-13.9" cy="14.4" r="2.2" style="--s:2.97s"/><path class="d pet2" pathLength="1" style="--s:2.98s;--t:0.4s" d="M0 0 L-28.6 5.0"/><circle class="fi dotc" cx="-28.6" cy="5.0" r="2.2" style="--s:3.01s"/><path class="d pet2" pathLength="1" style="--s:3.02s;--t:0.4s" d="M0 0 L-18.0 -8.8"/><circle class="fi dotc" cx="-18.0" cy="-8.8" r="2.2" style="--s:3.05s"/><path class="d pet2" pathLength="1" style="--s:3.06s;--t:0.4s" d="M0 0 L-13.6 -25.6"/><circle class="fi dotc" cx="-13.6" cy="-25.6" r="2.2" style="--s:3.09s"/><path class="d pet2" pathLength="1" style="--s:3.10s;--t:0.7s" d="M-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/></g></g>
