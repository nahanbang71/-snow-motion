<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff7eb6;--c2:#ffd1e6">
<title>Balsam - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C228 457 229 353 227 264"/><path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M235 535 C225 479 197 432 170 393 C182 439 200 491 235 535Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M234 530 C265 504 279 469 288 437 C265 461 241 490 234 530Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M230 531 C210 490 180 456 153 429 C172 463 196 501 230 531Z"/><path class="d stem" pathLength="1" style="--s:2.00s;--t:1s" d="M231 545 C272 511 300 466 321 426 C288 457 253 496 231 545Z"/><path class="d stem" pathLength="1" style="--s:2.20s;--t:1s" d="M229 528 C217 469 186 421 155 381 C169 429 189 484 229 528Z"/>

<g transform="translate(227 190) scale(1.2)"><g transform="rotate(0)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-22 -18.0 -22 -42.0 0 -60 C22 -42.0 22 -18.0 0 0Z"/></g><g transform="rotate(120)"><path class="d pet2" pathLength="1" style="--s:2.10s;--t:0.7s" d="M0 0 C-22 -16.8 -22 -39.2 0 -56 C22 -39.2 22 -16.8 0 0Z"/></g><g transform="rotate(-120)"><path class="d pet2" pathLength="1" style="--s:2.20s;--t:0.7s" d="M0 0 C-22 -16.8 -22 -39.2 0 -56 C22 -39.2 22 -16.8 0 0Z"/></g><g transform="rotate(-80)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-50 -6.2 -52.5 -40.3 -15.0 -58.9 C-5.0 -62 5.0 -62 15.0 -58.9 C52.5 -40.3 50 -6.2 0 0Z"/></g><g transform="rotate(80)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.7s" d="M0 0 C-50 -6.2 -52.5 -40.3 -15.0 -58.9 C-5.0 -62 5.0 -62 15.0 -58.9 C52.5 -40.3 50 -6.2 0 0Z"/></g><g transform="rotate(180)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-16 -10.2 -16 -23.8 0 -34 C16 -23.8 16 -10.2 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.70s;--t:0.7s" d="M0 -4 C-6 -12 6 -12 0 -4"/><path class="d pet2" pathLength="1" style="--s:2.77s;--t:0.7s" d="M-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.4s">Balsam</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.4s">Don&#x27;t touch me</text>
<circle class="sp" cx="420" cy="365" r="2.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="184" cy="337" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="478" cy="93" r="1.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="394" cy="290" r="1.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="628" cy="396" r="2.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="209" cy="312" r="2.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="693" cy="518" r="1.5" style="animation-delay:3.0s"/>
</svg>