 -30.8 -5.0 -44.0 L0 -37.0 L5.0 -44.0 C9.9 -30.8 8.1 -11.0 0 0Z"/></g><g transform="rotate(300.0) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-8.1 -11.0 -9.9 -30.8 -5.0 -44.0 L0 -37.0 L5.0 -44.0 C9.9 -30.8 8.1 -11.0 0 0Z"/></g><g transform="rotate(330.0) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.33s;--t:0.7s" d="M0 0 C-8.1 -11.0 -9.9 -30.8 -5.0 -44.0 L0 -37.0 L5.0 -44.0 C9.9 -30.8 8.1 -11.0 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.36s;--t:0.7s" d="M-12 0a12 12 0 1 0 24 0a12 12 0 1 0 -24 0"/><circle class="fi dotc" cx="1.9" cy="0.0" r="1.3" style="--s:2.43s"/><circle class="fi dotc" cx="-2.4" cy="2.2" r="1.3" style="--s:2.43s"/><circle class="fi dotc" cx="0.4" cy="-4.2" r="1.3" style="--s:2.44s"/><circle class="fi dotc" cx="3.1" cy="4.0" r="1.3" style="--s:2.44s"/><circle class="fi dotc" cx="-5.6" cy="-1.0" r="1.3" style="--s:2.45s"/><circle class="fi dotc" cx="5.3" cy="-3.4" r="1.3" style="--s:2.45s"/><circle class="fi dotc" cx="-1.8" cy="6.6" r="1.3" style="--s:2.45s"/><circle class="fi dotc" cx="-3.4" cy="-6.5" r="1.3" style="--s:2.46s"/><circle class="fi dotc" cx="7.4" cy="2.7" r="1.3" style="--s:2.46s"/><circle class="fi dotc" cx="-7.6" cy="3.2" r="1.3" style="--s:2.47s"/><circle class="fi dotc" cx="3.7" cy="-7.9" r="1.3" style="--s:2.47s"/><circle class="fi dotc" cx="2.7" cy="8.7" r="1.3" style="--s:2.47s"/><circle class="fi dotc" cx="-8.2" cy="-4.8" r="1.3" style="--s:2.48s"/><circle class="fi dotc" cx="9.6" cy="-2.1" r="1.3" style="--s:2.48s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Cornflower</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Happiness</text>
