<circle class="sp" cx="397" cy="211" r="2.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="477" cy="111" r="2" style="animation-delay:2.5s"/>
<circle class="sp" cx="249" cy="170" r="2.5" style="animation-delay:3.0s"/>
</svg>