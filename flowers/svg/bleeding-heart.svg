<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff7eb6;--c2:#ffd1e6">
<title>Bleeding Heart - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 16.5 0 23.1"/><g transform="translate(0 23.1)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-26.4 -19.8 -49.5 16.5 0 56.1 C49.5 16.5 26.4 -19.8 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.3s" d="M0 56.1 L0 75.9"/><circle class="fi dotc" cx="0" cy="80.9" r="2.4" style="--s:2.20s"/></g></g><g transform="translate(215.1 173.4)"><path class="d pet2" pathLength="1" style="--s:2.21s;--t:0.4s" d="M0 0 Q4 14.8 0 20.7"/><g transform="translate(0 20.7)"><path class="d pet" pathLength="1" style="--s:2.26s;--t:0.8s" d="M0 0 C-23.7 -17.8 -44.4 14.8 0 50.4 C44.4 14.8 23.7 -17.8 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.36s;--t:0.3s" d="M0 50.4 L0 68.1"/><circle class="fi dotc" cx="0" cy="72.6" r="2.4" style="--s:2.41s"/></g></g><g transform="translate(195.5 155.5)"><path class="d pet2" pathLength="1" style="--s:2.41s;--t:0.4s" d="M0 0 Q4 13.1 0 18.4"/><g transform="translate(0 18.4)"><path class="d pet" pathLength="1" style="--s:2.46s;--t:0.8s" d="M0 0 C-21.0 -15.8 -39.4 13.1 0 44.6 C39.4 13.1 21.0 -15.8 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.56s;--t:0.3s" d="M0 44.6 L0 60.4"/><circle class="fi dotc" cx="0" cy="64.3" r="2.4" style="--s:2.61s"/></g></g><g transform="translate(170.3 146.1)"><path class="d pet2" pathLength="1" style="--s:2.62s;--t:0.4s" d="M0 0 Q4 11.4 0 16.0"/><g transform="translate(0 16.0)"><path class="d pet" pathLength="1" style="--s:2.67s;--t:0.8s" d="M0 0 C-18.3 -13.7 -34.3 11.4 0 38.9 C34.3 11.4 18.3 -13.7 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.77s;--t:0.3s" d="M0 38.9 L0 52.6"/><circle class="fi dotc" cx="0" cy="56.0" r="2.4" style="--s:2.82s"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:2.82s;--t:0.4s" d="M0 0 Q4 9.8 0 13.7"/><g transform="translate(0 13.7)"><path class="d pet" pathLength="1" style="--s:2.87s;--t:0.8s" d="M0 0 C-15.6 -11.7 -29.3 9.8 0 33.2 C29.3 9.8 15.6 -11.7 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.97s;--t:0.3s" d="M0 33.2 L0 44.9"/><circle class="fi dotc" cx="0" cy="47.8" r="2.4" style="--s:3.02s"/></g></g></g></g>
<text class="title" x="60" y="270" font-size="43" style="--s:3.4s">Bleeding Heart</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.4s">I will follow you</text>
<circle class="sp" cx="193" cy="85" r="1.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="277" cy="142" r="2" style="animation-delay:0.5s"/>
<circle class="sp" cx="609" cy="330" r="1.5" style="animation-delay:1.0s"/>
