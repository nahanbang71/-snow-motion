<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ffe14a;--c2:#fff4b0">
<title>Yellow Tulip - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C233 450 221 340 225 245"/><g transform="translate(229 461) rotate(-55)"><path class="d stem" pathLength="1" style="--s:0.84s;--t:0.9s" d="M0 0 C28 -21 76 -19 95 0 C76 19 28 21 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.14s;--t:0.5s" d="M0 0 L76 0"/></g><g transform="translate(227 397) rotate(-144)"><path class="d stem" pathLength="1" style="--s:1.20s;--t:0.9s" d="M0 0 C22 -20 60 -18 75 0 C60 18 22 20 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.50s;--t:0.5s" d="M0 0 L60 0"/></g><g transform="translate(226 359) rotate(-53)"><path class="d stem" pathLength="1" style="--s:1.42s;--t:0.9s" d="M0 0 C24 -20 64 -18 80 0 C64 18 24 20 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.72s;--t:0.5s" d="M0 0 L64 0"/></g>

<g transform="translate(225 190) scale(1.2)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:1s" d="M0 50 C-44 46 -50 0 -40 -62 C-24 -48 -12 -34 -4 -14 C-2 20 0 40 0 50Z"/><path class="d pet" pathLength="1" style="--s:2.25s;--t:1s" d="M0 50 C44 46 50 0 40 -62 C24 -48 12 -34 4 -14 C2 20 0 40 0 50Z"/><path class="d pet" pathLength="1" style="--s:2.50s;--t:1s" d="M0 50 C-26 30 -30 -20 0 -76 C30 -20 26 30 0 50Z"/><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 40 C-10 10 -8 -25 0 -52"/></g></g>
<text class="title" x="360" y="270" font-size="50" style="--s:3.4s">Yellow Tulip</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Hopeless love</text>
<circle class="sp" cx="711" cy="112" r="2.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="128" cy="504" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="723" cy="190" r="2.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="644" cy="509" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="293" cy="218" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="381" cy="368" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="236" cy="361" r="2" style="animation-delay:3.0s"/>
</svg>