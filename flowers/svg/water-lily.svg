<circle class="sp" cx="126" cy="389" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="433" cy="504" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="382" cy="120" r="2.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="599" cy="458" r="1.5" style="animation-delay:3.0s"/>
</svg>