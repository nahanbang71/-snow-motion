<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#9a7dff;--c2:#d9ccff">
<title>Water Lily - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d rip" pathLength="1" style="--s:0.50s;--t:1.2s" d="M110 408 a125 20 0 1 0 250 0 a125 20 0 1 0 -250 0"/><path class="d rip" pathLength="1" style="--s:0.90s;--t:1.2s" d="M147 408 a88 14 0 1 0 176 0 a88 14 0 1 0 -176 0"/><path class="d rip" pathLength="1" style="--s:1.30s;--t:1.2s" d="M181 408 a54 8 0 1 0 108 0 a54 8 0 1 0 -108 0"/>
<g transform="translate(230 400) scale(1.3)"><g transform="rotate(-78.0)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(-52.0)"><path class="d pet" pathLength="1" style="--s:2.10s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(-26.0)"><path class="d pet" pathLength="1" style="--s:2.20s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(0.0)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(26.0)"><path class="d pet" pathLength="1" style="--s:2.40s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(52.0)"><path class="d pet" pathLength="1" style="--s:2.50s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(78.0)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-17 -22.2 -17 -51.8 0 -74 C17 -51.8 17 -22.2 0 0Z"/></g><g transform="rotate(-52.0)"><path class="d pet" pathLength="1" style="--s:2.70s;--t:0.7s" d="M0 0 C-15 -18.6 -15 -43.4 0 -62 C15 -43.4 15 -18.6 0 0Z"/></g><g transform="rotate(-26.0)"><path class="d pet" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 0 C-15 -18.6 -15 -43.4 0 -62 C15 -43.4 15 -18.6 0 0Z"/></g><g transform="rotate(0.0)"><path class="d pet" pathLength="1" style="--s:2.90s;--t:0.7s" d="M0 0 C-15 -18.6 -15 -43.4 0 -62 C15 -43.4 15 -18.6 0 0Z"/></g><g transform="rotate(26.0)"><path class="d pet" pathLength="1" style="--s:3.00s;--t:0.7s" d="M0 0 C-15 -18.6 -15 -43.4 0 -62 C15 -43.4 15 -18.6 0 0Z"/></g><g transform="rotate(52.0)"><path class="d pet" pathLength="1" style="--s:3.10s;--t:0.7s" d="M0 0 C-15 -18.6 -15 -43.4 0 -62 C15 -43.4 15 -18.6 0 0Z"/></g><g transform="rotate(-26.0)"><path class="d pet2" pathLength="1" style="--s:3.20s;--t:0.7s" d="M0 0 C-13 -15.0 -13 -35.0 0 -50 C13 -35.0 13 -15.0 0 0Z"/></g><g transform="rotate(0.0)"><path class="d pet2" pathLength="1" style="--s:3.30s;--t:0.7s" d="M0 0 C-13 -15.0 -13 -35.0 0 -50 C13 -35.0 13 -15.0 0 0Z"/></g><g transform="rotate(26.0)"><path class="d pet2" pathLength="1" style="--s:3.40s;--t:0.7s" d="M0 0 C-13 -15.0 -13 -35.0 0 -50 C13 -35.0 13 -15.0 0 0Z"/></g></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.8s">Water Lily</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.8s">Peace of mind</text>
<circle class="sp" cx="61" cy="318" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="672" cy="181" r="2" style="animation-delay:0.5s"/>
