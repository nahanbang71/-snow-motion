<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#c9b8ff;--c2:#f1ebff">
<title>Hosta - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.ko{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#aab0d6;opacity:0;animation:fade 1s ease-out calc(var(--s) + 1.1s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 14.3 0 20.0"/><g transform="translate(0 20.0)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-21.5 0 -24.3 28.6 -34.3 48.6 Q0 60.1 34.3 48.6 C24.3 28.6 21.5 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.4s" d="M-34.3 48.6 Q0 37.2 34.3 48.6"/></g></g><g transform="translate(215.1 173.4)"><path class="d pet2" pathLength="1" style="--s:2.20s;--t:0.4s" d="M0 0 Q4 12.8 0 18.0"/><g transform="translate(0 18.0)"><path class="d pet" pathLength="1" style="--s:2.25s;--t:0.8s" d="M0 0 C-19.3 0 -21.8 25.7 -30.8 43.6 Q0 53.9 30.8 43.6 C21.8 25.7 19.3 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.35s;--t:0.4s" d="M-30.8 43.6 Q0 33.4 30.8 43.6"/></g></g><g transform="translate(195.5 155.5)"><path class="d pet2" pathLength="1" style="--s:2.40s;--t:0.4s" d="M0 0 Q4 11.4 0 15.9"/><g transform="translate(0 15.9)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.8s" d="M0 0 C-17.1 0 -19.3 22.8 -27.3 38.7 Q0 47.8 27.3 38.7 C19.3 22.8 17.1 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.55s;--t:0.4s" d="M-27.3 38.7 Q0 29.6 27.3 38.7"/></g></g><g transform="translate(170.3 146.1)"><path class="d pet2" pathLength="1" style="--s:2.60s;--t:0.4s" d="M0 0 Q4 9.9 0 13.9"/><g transform="translate(0 13.9)"><path class="d pet" pathLength="1" style="--s:2.65s;--t:0.8s" d="M0 0 C-14.9 0 -16.9 19.8 -23.8 33.7 Q0 41.6 23.8 33.7 C16.9 19.8 14.9 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.4s" d="M-23.8 33.7 Q0 25.8 23.8 33.7"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.4s" d="M0 0 Q4 8.5 0 11.8"/><g transform="translate(0 11.8)"><path class="d pet" pathLength="1" style="--s:2.85s;--t:0.8s" d="M0 0 C-12.7 0 -14.4 16.9 -20.3 28.7 Q0 35.5 20.3 28.7 C14.4 16.9 12.7 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.95s;--t:0.4s" d="M-20.3 28.7 Q0 22.0 20.3 28.7"/></g></g></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Hosta</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Fate from heaven</text>
<text class="ko" x="364" y="352" font-size="20" style="--s:3.4s">비비추 · 하늘이 내린 인연</text>
