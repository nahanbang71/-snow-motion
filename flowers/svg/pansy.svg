<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#b48cff;--c2:#e6d6ff">
<title>Pansy - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C252 457 260 353 243 264"/><g transform="translate(237 523) rotate(-131)"><path class="d stem" pathLength="1" style="--s:0.52s;--t:0.9s" d="M0 0 C32 -30 85 -27 107 0 C85 27 32 30 0 0Z"/><path class="d pet2" pathLength="1" style="--s:0.82s;--t:0.5s" d="M0 0 L85 0"/></g><g transform="translate(251 407) rotate(-52)"><path class="d stem" pathLength="1" style="--s:1.20s;--t:0.9s" d="M0 0 C25 -20 68 -18 85 0 C68 18 25 20 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.50s;--t:0.5s" d="M0 0 L68 0"/></g>

<g transform="translate(243 190) scale(1.2)"><g transform="rotate(-30)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-36 -5.8 -37.8 -37.7 -10.8 -55.1 C-3.6 -58 3.6 -58 10.8 -55.1 C37.8 -37.7 36 -5.8 0 0Z"/></g><g transform="rotate(30)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-36 -5.8 -37.8 -37.7 -10.8 -55.1 C-3.6 -58 3.6 -58 10.8 -55.1 C37.8 -37.7 36 -5.8 0 0Z"/></g><g transform="rotate(-78)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-34 -5.2 -35.7 -33.8 -10.2 -49.4 C-3.4 -52 3.4 -52 10.2 -49.4 C35.7 -33.8 34 -5.2 0 0Z"/></g><g transform="rotate(78)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-34 -5.2 -35.7 -33.8 -10.2 -49.4 C-3.4 -52 3.4 -52 10.2 -49.4 C35.7 -33.8 34 -5.2 0 0Z"/></g><g transform="rotate(180)"><path class="d pet" pathLength="1" style="--s:2.48s;--t:0.7s" d="M0 0 C-46 -6.6 -48.3 -42.9 -13.8 -62.7 C-4.6 -66 4.6 -66 13.8 -62.7 C48.3 -42.9 46 -6.6 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.63s;--t:0.4s" d="M3.0 5.2 L16.0 27.7"/><path class="d pet2" pathLength="1" style="--s:2.67s;--t:0.4s" d="M0.0 6.0 L0.0 32.0"/><path class="d pet2" pathLength="1" style="--s:2.71s;--t:0.4s" d="M-3.0 5.2 L-16.0 27.7"/><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.7s" d="M-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.4s">Pansy</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.4s">Think of me</text>
<circle class="sp" cx="412" cy="332" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="189" cy="202" r="2" style="animation-delay:0.5s"/>
<circle class="sp" cx="353" cy="383" r="2" style="animation-delay:1.0s"/>
<circle class="sp" cx="496" cy="450" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="184" cy="167" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="119" cy="434" r="2" style="animation-delay:2.5s"/>
<circle class="sp" cx="269" cy="405" r="2.5" style="animation-delay:3.0s"/>
</svg>