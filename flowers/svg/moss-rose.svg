 class="d pet2" pathLength="1" style="--s:2.92s;--t:0.7s" d="M0 0 C-22.4 -3.6 -23.6 -23.2 -6.7 -33.9 C-2.2 -35.6 2.2 -35.6 6.7 -33.9 C23.6 -23.2 22.4 -3.6 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:3.00s;--t:0.7s" d="M-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/><circle class="fi dotc" cx="16.0" cy="0.0" r="1.8" style="--s:3.07s"/><circle class="fi dotc" cx="14.4" cy="6.9" r="1.8" style="--s:3.09s"/><circle class="fi dotc" cx="10.0" cy="12.5" r="1.8" style="--s:3.11s"/><circle class="fi dotc" cx="3.6" cy="15.6" r="1.8" style="--s:3.13s"/><circle class="fi dotc" cx="-3.6" cy="15.6" r="1.8" style="--s:3.15s"/><circle class="fi dotc" cx="-10.0" cy="12.5" r="1.8" style="--s:3.17s"/><circle class="fi dotc" cx="-14.4" cy="6.9" r="1.8" style="--s:3.19s"/><circle class="fi dotc" cx="-16.0" cy="0.0" r="1.8" style="--s:3.21s"/><circle class="fi dotc" cx="-14.4" cy="-6.9" r="1.8" style="--s:3.23s"/><circle class="fi dotc" cx="-10.0" cy="-12.5" r="1.8" style="--s:3.25s"/><circle class="fi dotc" cx="-3.6" cy="-15.6" r="1.8" style="--s:3.27s"/><circle class="fi dotc" cx="3.6" cy="-15.6" r="1.8" style="--s:3.29s"/><circle class="fi dotc" cx="10.0" cy="-12.5" r="1.8" style="--s:3.31s"/><circle class="fi dotc" cx="14.4" cy="-6.9" r="1.8" style="--s:3.33s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.7s">Moss Rose</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.7s">Innocence</text>
