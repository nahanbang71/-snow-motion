<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff9a3c;--c2:#ffd4a8">
<title>Sulphur Cosmos - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C201 453 194 346 211 254"/><g transform="translate(221 521) rotate(-125)"><path class="d stem" pathLength="1" style="--s:0.52s;--t:0.9s" d="M0 0 C34 -29 91 -27 113 0 C91 27 34 29 0 0Z"/><path class="d pet2" pathLength="1" style="--s:0.82s;--t:0.5s" d="M0 0 L91 0"/></g><g transform="translate(202 364) rotate(-35)"><path class="d stem" pathLength="1" style="--s:1.42s;--t:0.9s" d="M0 0 C24 -20 64 -18 80 0 C64 18 24 20 0 0Z"/><path class="d pet2" pathLength="1" style="--s:1.72s;--t:0.5s" d="M0 0 L64 0"/></g>

<g transform="translate(211 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(45.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.03s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(90.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.06s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(135.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.09s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(180.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(225.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.15s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(270.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.18s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><g transform="rotate(315.0) translate(0 -8.0)"><path class="d pet" pathLength="1" style="--s:2.21s;--t:0.7s" d="M0 0 C-18.0 -12.5 -22.0 -35.0 -11.0 -50.0 L0 -42.0 L11.0 -50.0 C22.0 -35.0 18.0 -12.5 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.24s;--t:0.7s" d="M-10 0a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"/><circle class="fi dotc" cx="1.9" cy="0.0" r="1.3" style="--s:2.31s"/><circle class="fi dotc" cx="-2.4" cy="2.2" r="1.3" style="--s:2.31s"/><circle class="fi dotc" cx="0.4" cy="-4.2" r="1.3" style="--s:2.32s"/><circle class="fi dotc" cx="3.0" cy="3.9" r="1.3" style="--s:2.32s"/><circle class="fi dotc" cx="-5.5" cy="-1.0" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="5.2" cy="-3.3" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="-1.8" cy="6.5" r="1.3" style="--s:2.33s"/><circle class="fi dotc" cx="-3.3" cy="-6.4" r="1.3" style="--s:2.34s"/><circle class="fi dotc" cx="7.2" cy="2.6" r="1.3" style="--s:2.34s"/><circle class="fi dotc" cx="-7.5" cy="3.1" r="1.3" style="--s:2.35s"/></g></g>
<text class="title" x="360" y="270" font-size="43" style="--s:3.4s">Sulphur Cosmos</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Joy</text>
