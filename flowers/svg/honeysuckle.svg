<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ffe14a;--c2:#fff4b0">
<title>Honeysuckle - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.ko{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#aab0d6;opacity:0;animation:fade 1s ease-out calc(var(--s) + 1.1s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 451 234 343 230 250"/>
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(230 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(60.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(180.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.48s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(300.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-10 -18.6 -10 -43.4 0 -62 C10 -43.4 10 -18.6 0 0Z"/></g><g transform="rotate(30.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.72s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><g transform="rotate(90.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><g transform="rotate(150.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.88s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><g transform="rotate(210.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.96s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><g transform="rotate(270.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.04s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><g transform="rotate(330.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.12s;--t:0.7s" d="M0 0 C-7.0 -13.4 -7.0 -31.2 0 -44.6 C7.0 -31.2 7.0 -13.4 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:3.20s;--t:0.4s" d="M0 0 L14.0 -24.2"/><circle class="fi dotc" cx="14.0" cy="-24.2" r="2.4" style="--s:3.23s"/><path class="d pet2" pathLength="1" style="--s:3.25s;--t:0.4s" d="M0 0 L34.0 -0.0"/><circle class="fi dotc" cx="34.0" cy="-0.0" r="2.4" style="--s:3.28s"/><path class="d pet2" pathLength="1" style="--s:3.30s;--t:0.4s" d="M0 0 L14.0 24.2"/><circle class="fi dotc" cx="14.0" cy="24.2" r="2.4" style="--s:3.33s"/><path class="d pet2" pathLength="1" style="--s:3.35s;--t:0.4s" d="M0 0 L-17.0 29.4"/><circle class="fi dotc" cx="-17.0" cy="29.4" r="2.4" style="--s:3.38s"/><path class="d pet2" pathLength="1" style="--s:3.40s;--t:0.4s" d="M0 0 L-28.0 0.0"/><circle class="fi dotc" cx="-28.0" cy="0.0" r="2.4" style="--s:3.43s"/><path class="d pet2" pathLength="1" style="--s:3.45s;--t:0.4s" d="M0 0 L-17.0 -29.4"/><circle class="fi dotc" cx="-17.0" cy="-29.4" r="2.4" style="--s:3.48s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.8s">Honeysuckle</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.8s">Devoted love</text>
<text class="ko" x="364" y="352" font-size="20" style="--s:3.8s">인동덩굴 · 헌신적 사랑</text>
