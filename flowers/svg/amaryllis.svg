<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff3860;--c2:#ffb3c1">
<title>Amaryllis - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C209 456 188 352 210 263"/><path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M235 523 C237 466 217 416 196 373 C198 420 206 475 235 523Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M228 533 C254 516 264 489 269 464 C249 480 230 502 228 533Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M228 525 C234 464 217 408 198 360 C197 411 201 470 228 525Z"/><path class="d stem" pathLength="1" style="--s:2.00s;--t:1s" d="M234 546 C271 518 292 479 307 443 C278 469 248 502 234 546Z"/><path class="d stem" pathLength="1" style="--s:2.20s;--t:1s" d="M232 521 C205 484 168 458 135 438 C160 467 192 500 232 521Z"/>

<g transform="translate(210 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(60.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(180.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.48s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(300.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-24 -22.8 -24 -53.2 0 -76 C24 -53.2 24 -22.8 0 0Z"/></g><g transform="rotate(30.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.72s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><g transform="rotate(90.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><g transform="rotate(150.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.88s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><g transform="rotate(210.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.96s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><g transform="rotate(270.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.04s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><g transform="rotate(330.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.12s;--t:0.7s" d="M0 0 C-16.8 -16.4 -16.8 -38.3 0 -54.7 C16.8 -38.3 16.8 -16.4 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:3.20s;--t:0.4s" d="M0 0 L14.0 -24.2"/><circle class="fi dotc" cx="14.0" cy="-24.2" r="2.4" style="--s:3.23s"/><path class="d pet2" pathLength="1" style="--s:3.25s;--t:0.4s" d="M0 0 L34.0 -0.0"/><circle class="fi dotc" cx="34.0" cy="-0.0" r="2.4" style="--s:3.28s"/><path class="d pet2" pathLength="1" style="--s:3.30s;--t:0.4s" d="M0 0 L14.0 24.2"/><circle class="fi dotc" cx="14.0" cy="24.2" r="2.4" style="--s:3.33s"/><path class="d pet2" pathLength="1" style="--s:3.35s;--t:0.4s" d="M0 0 L-17.0 29.4"/><circle class="fi dotc" cx="-17.0" cy="29.4" r="2.4" style="--s:3.38s"/><path class="d pet2" pathLength="1" style="--s:3.40s;--t:0.4s" d="M0 0 L-28.0 0.0"/><circle class="fi dotc" cx="-28.0" cy="0.0" r="2.4" style="--s:3.43s"/><path class="d pet2" pathLength="1" style="--s:3.45s;--t:0.4s" d="M0 0 L-17.0 -29.4"/><circle class="fi dotc" cx="-17.0" cy="-29.4" r="2.4" style="--s:3.48s"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.8s">Amaryllis</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.8s">Radiant beauty</text>
