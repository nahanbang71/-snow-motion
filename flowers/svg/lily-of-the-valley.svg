<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#f2f6ff;--c2:#ffffff">
<title>Lily of the Valley - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 9.9 0 13.9"/><g transform="translate(0 13.9)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-14.9 0 -16.8 19.8 -23.8 33.7 Q0 41.6 23.8 33.7 C16.8 19.8 14.9 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.4s" d="M-23.8 33.7 Q0 25.7 23.8 33.7"/></g></g><g transform="translate(218.2 177.9)"><path class="d pet2" pathLength="1" style="--s:2.20s;--t:0.4s" d="M0 0 Q4 9.1 0 12.7"/><g transform="translate(0 12.7)"><path class="d pet" pathLength="1" style="--s:2.25s;--t:0.8s" d="M0 0 C-13.6 0 -15.5 18.2 -21.8 30.9 Q0 38.2 21.8 30.9 C15.5 18.2 13.6 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.35s;--t:0.4s" d="M-21.8 30.9 Q0 23.6 21.8 30.9"/></g></g><g transform="translate(204.1 161.7)"><path class="d pet2" pathLength="1" style="--s:2.40s;--t:0.4s" d="M0 0 Q4 8.3 0 11.6"/><g transform="translate(0 11.6)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.8s" d="M0 0 C-12.4 0 -14.1 16.6 -19.9 28.2 Q0 34.8 19.9 28.2 C14.1 16.6 12.4 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.55s;--t:0.4s" d="M-19.9 28.2 Q0 21.5 19.9 28.2"/></g></g><g transform="translate(186.0 150.6)"><path class="d pet2" pathLength="1" style="--s:2.60s;--t:0.4s" d="M0 0 Q4 7.5 0 10.5"/><g transform="translate(0 10.5)"><path class="d pet" pathLength="1" style="--s:2.65s;--t:0.8s" d="M0 0 C-11.2 0 -12.7 14.9 -17.9 25.4 Q0 31.4 17.9 25.4 C12.7 14.9 11.2 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.4s" d="M-17.9 25.4 Q0 19.4 17.9 25.4"/></g></g><g transform="translate(164.7 145.5)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.4s" d="M0 0 Q4 6.7 0 9.3"/><g transform="translate(0 9.3)"><path class="d pet" pathLength="1" style="--s:2.85s;--t:0.8s" d="M0 0 C-10.0 0 -11.3 13.3 -16.0 22.6 Q0 28.0 16.0 22.6 C11.3 13.3 10.0 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.95s;--t:0.4s" d="M-16.0 22.6 Q0 17.3 16.0 22.6"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:3.00s;--t:0.4s" d="M0 0 Q4 5.9 0 8.2"/><g transform="translate(0 8.2)"><path class="d pet" pathLength="1" style="--s:3.05s;--t:0.8s" d="M0 0 C-8.8 0 -9.9 11.7 -14.0 19.9 Q0 24.6 14.0 19.9 C9.9 11.7 8.8 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:3.15s;--t:0.4s" d="M-14.0 19.9 Q0 15.2 14.0 19.9"/></g></g></g></g>
<text class="title" x="360" y="270" font-size="33" style="--s:3.5s">Lily of the Valley</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.5s">Return of happiness</text>
