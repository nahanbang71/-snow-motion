<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#f2f6ff;--c2:#ffffff">
<title>Snowdrop - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M230 540 C208 504 175 481 144 463 C165 491 192 522 230 540Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M233 521 C259 499 269 468 274 440 C255 461 236 487 233 521Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M232 527 C225 477 204 433 184 395 C193 437 206 484 232 527Z"/><path class="d stem" pathLength="1" style="--s:2.00s;--t:1s" d="M233 541 C257 491 263 438 265 391 C248 434 231 486 233 541Z"/><path class="d stem" pathLength="1" style="--s:2.20s;--t:1s" d="M230 544 C226 513 210 489 194 469 C199 494 208 522 230 544Z"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 16.5 0 23.1"/><g transform="translate(0 23.1)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-24.8 0 -28.1 33.0 -39.6 56.1 Q0 69.3 39.6 56.1 C28.1 33.0 24.8 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.4s" d="M-39.6 56.1 Q0 42.9 39.6 56.1"/></g></g><g transform="translate(195.5 155.5)"><path class="d pet2" pathLength="1" style="--s:2.20s;--t:0.4s" d="M0 0 Q4 13.1 0 18.4"/><g transform="translate(0 18.4)"><path class="d pet" pathLength="1" style="--s:2.25s;--t:0.8s" d="M0 0 C-19.7 0 -22.3 26.3 -31.5 44.6 Q0 55.1 31.5 44.6 C22.3 26.3 19.7 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.35s;--t:0.4s" d="M-31.5 44.6 Q0 34.1 31.5 44.6"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:2.40s;--t:0.4s" d="M0 0 Q4 9.8 0 13.7"/><g transform="translate(0 13.7)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.8s" d="M0 0 C-14.6 0 -16.6 19.5 -23.4 33.2 Q0 41.0 23.4 33.2 C16.6 19.5 14.6 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.55s;--t:0.4s" d="M-23.4 33.2 Q0 25.4 23.4 33.2"/></g></g></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Snowdrop</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Hope</text>
<circle class="sp" cx="407" cy="450" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="596" cy="528" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="204" cy="247" r="1.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="361" cy="523" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="362" cy="476" r="1.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="363" cy="513" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="414" cy="305" r="2" style="animation-delay:3.0s"/>
</svg>