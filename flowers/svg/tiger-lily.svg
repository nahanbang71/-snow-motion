<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff9a3c;--c2:#ffd4a8">
<title>Tiger Lily - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C257 454 269 348 245 257"/><path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M227 537 C217 473 193 414 170 364 C181 418 198 480 227 537Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M225 528 C267 483 297 431 320 384 C286 424 250 472 225 528Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M229 556 C230 506 214 460 198 421 C200 463 206 511 229 556Z"/><path class="d stem" pathLength="1" style="--s:2.00s;--t:1s" d="M226 541 C261 495 276 441 284 393 C258 434 231 483 226 541Z"/>

<g transform="translate(245 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(60.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(180.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.48s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(300.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.60s;--t:0.7s" d="M0 0 C-22 -21.0 -22 -49.0 0 -70 C22 -49.0 22 -21.0 0 0Z"/></g><g transform="rotate(30.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.72s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><g transform="rotate(90.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.80s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><g transform="rotate(150.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.88s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><g transform="rotate(210.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:2.96s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><g transform="rotate(270.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.04s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><g transform="rotate(330.0) translate(0 -3)"><path class="d pet2" pathLength="1" style="--s:3.12s;--t:0.7s" d="M0 0 C-15.4 -15.1 -15.4 -35.3 0 -50.4 C15.4 -35.3 15.4 -15.1 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:3.20s;--t:0.4s" d="M0 0 L14.0 -24.2"/><circle class="fi dotc" cx="14.0" cy="-24.2" r="2.4" style="--s:3.23s"/><path class="d pet2" pathLength="1" style="--s:3.25s;--t:0.4s" d="M0 0 L34.0 -0.0"/><circle class="fi dotc" cx="34.0" cy="-0.0" r="2.4" style="--s:3.28s"/><path class="d pet2" pathLength="1" style="--s:3.30s;--t:0.4s" d="M0 0 L14.0 24.2"/><circle class="fi dotc" cx="14.0" cy="24.2" r="2.4" style="--s:3.33s"/><path class="d pet2" pathLength="1" style="--s:3.35s;--t:0.4s" d="M0 0 L-17.0 29.4"/><circle class="fi dotc" cx="-17.0" cy="29.4" r="2.4" style="--s:3.38s"/><path class="d pet2" pathLength="1" style="--s:3.40s;--t:0.4s" d="M0 0 L-28.0 0.0"/><circle class="fi dotc" cx="-28.0" cy="0.0" r="2.4" style="--s:3.43s"/><path class="d pet2" pathLength="1" style="--s:3.45s;--t:0.4s" d="M0 0 L-17.0 -29.4"/><circle class="fi dotc" cx="-17.0" cy="-29.4" r="2.4" style="--s:3.48s"/></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.8s">Tiger Lily</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.8s">Confidence</text>
<circle class="sp" cx="155" cy="293" r="1.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="389" cy="292" r="2.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="535" cy="276" r="2.5" style="animation-delay:1.0s"/>
