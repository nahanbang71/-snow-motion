<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#f2f6ff;--c2:#ffffff">
<title>Pear Blossom - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 449 234 339 230 244"/>
<path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M230 480 C190 495 158 465 152 425 C192 422 226 440 230 480Z"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M230 440 C268 452 300 425 306 388 C266 388 234 404 230 440Z"/>

<g transform="translate(230 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-27 -5.6 -28.4 -36.4 -8.1 -53.2 C-2.7 -56 2.7 -56 8.1 -53.2 C28.4 -36.4 27 -5.6 0 0Z"/></g><g transform="rotate(72.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.07s;--t:0.7s" d="M0 0 C-27 -5.6 -28.4 -36.4 -8.1 -53.2 C-2.7 -56 2.7 -56 8.1 -53.2 C28.4 -36.4 27 -5.6 0 0Z"/></g><g transform="rotate(144.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.14s;--t:0.7s" d="M0 0 C-27 -5.6 -28.4 -36.4 -8.1 -53.2 C-2.7 -56 2.7 -56 8.1 -53.2 C28.4 -36.4 27 -5.6 0 0Z"/></g><g transform="rotate(216.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.21s;--t:0.7s" d="M0 0 C-27 -5.6 -28.4 -36.4 -8.1 -53.2 C-2.7 -56 2.7 -56 8.1 -53.2 C28.4 -36.4 27 -5.6 0 0Z"/></g><g transform="rotate(288.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.28s;--t:0.7s" d="M0 0 C-27 -5.6 -28.4 -36.4 -8.1 -53.2 C-2.7 -56 2.7 -56 8.1 -53.2 C28.4 -36.4 27 -5.6 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.35s;--t:0.4s" d="M0 0 L2.8 -19.8"/><circle class="fi dotc" cx="2.8" cy="-19.8" r="2.2" style="--s:2.38s"/><path class="d pet2" pathLength="1" style="--s:2.39s;--t:0.4s" d="M0 0 L20.1 -20.9"/><circle class="fi dotc" cx="20.1" cy="-20.9" r="2.2" style="--s:2.42s"/><path class="d pet2" pathLength="1" style="--s:2.43s;--t:0.4s" d="M0 0 L19.7 -3.5"/><circle class="fi dotc" cx="19.7" cy="-3.5" r="2.2" style="--s:2.46s"/><path class="d pet2" pathLength="1" style="--s:2.47s;--t:0.4s" d="M0 0 L26.1 12.7"/><circle class="fi dotc" cx="26.1" cy="12.7" r="2.2" style="--s:2.50s"/><path class="d pet2" pathLength="1" style="--s:2.51s;--t:0.4s" d="M0 0 L9.4 17.7"/><circle class="fi dotc" cx="9.4" cy="17.7" r="2.2" style="--s:2.54s"/><path class="d pet2" pathLength="1" style="--s:2.55s;--t:0.4s" d="M0 0 L-4.0 28.7"/><circle class="fi dotc" cx="-4.0" cy="28.7" r="2.2" style="--s:2.58s"/><path class="d pet2" pathLength="1" style="--s:2.59s;--t:0.4s" d="M0 0 L-13.9 14.4"/><circle class="fi dotc" cx="-13.9" cy="14.4" r="2.2" style="--s:2.62s"/><path class="d pet2" pathLength="1" style="--s:2.63s;--t:0.4s" d="M0 0 L-28.6 5.0"/><circle class="fi dotc" cx="-28.6" cy="5.0" r="2.2" style="--s:2.66s"/><path class="d pet2" pathLength="1" style="--s:2.67s;--t:0.4s" d="M0 0 L-18.0 -8.8"/><circle class="fi dotc" cx="-18.0" cy="-8.8" r="2.2" style="--s:2.70s"/><path class="d pet2" pathLength="1" style="--s:2.71s;--t:0.4s" d="M0 0 L-13.6 -25.6"/><circle class="fi dotc" cx="-13.6" cy="-25.6" r="2.2" style="--s:2.74s"/><path class="d pet2" pathLength="1" style="--s:2.75s;--t:0.7s" d="M-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/></g></g>
<text class="title" x="360" y="270" font-size="50" style="--s:3.4s">Pear Blossom</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Comfort</text>
<circle class="sp" cx="405" cy="323" r="2.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="280" cy="324" r="2.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="173" cy="292" r="2" style="animation-delay:1.0s"/>
<circle class="sp" cx="495" cy="127" r="2" style="animation-delay:1.5s"/>
<circle class="sp" cx="373" cy="502" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="683" cy="443" r="2.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="157" cy="534" r="2" style="animation-delay:3.0s"/>
</svg>