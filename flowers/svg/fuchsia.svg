<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff4fd8;--c2:#ffc1f2">
<title>Fuchsia - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)" transform="translate(800 0) scale(-1 1)">
<path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M227 535 C224 489 204 449 183 416 C189 454 199 498 227 535Z"/><path class="d stem" pathLength="1" style="--s:1.60s;--t:1s" d="M227 545 C263 502 281 451 294 405 C266 443 238 490 227 545Z"/><path class="d stem" pathLength="1" style="--s:1.80s;--t:1s" d="M228 551 C229 501 209 457 189 420 C192 462 200 509 228 551Z"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 14.3 0 20.0"/><g transform="translate(0 20.0)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-22.9 -17.2 -42.9 14.3 0 48.6 C42.9 14.3 22.9 -17.2 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.3s" d="M0 48.6 L0 65.8"/><circle class="fi dotc" cx="0" cy="70.1" r="2.4" style="--s:2.20s"/></g></g><g transform="translate(209.3 166.6)"><path class="d pet2" pathLength="1" style="--s:2.21s;--t:0.4s" d="M0 0 Q4 12.4 0 17.3"/><g transform="translate(0 17.3)"><path class="d pet" pathLength="1" style="--s:2.26s;--t:0.8s" d="M0 0 C-19.8 -14.8 -37.1 12.4 0 42.0 C37.1 12.4 19.8 -14.8 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.36s;--t:0.3s" d="M0 42.0 L0 56.8"/><circle class="fi dotc" cx="0" cy="60.5" r="2.4" style="--s:2.41s"/></g></g><g transform="translate(179.2 148.2)"><path class="d pet2" pathLength="1" style="--s:2.41s;--t:0.4s" d="M0 0 Q4 10.4 0 14.6"/><g transform="translate(0 14.6)"><path class="d pet" pathLength="1" style="--s:2.46s;--t:0.8s" d="M0 0 C-16.6 -12.5 -31.2 10.4 0 35.4 C31.2 10.4 16.6 -12.5 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.56s;--t:0.3s" d="M0 35.4 L0 47.8"/><circle class="fi dotc" cx="0" cy="51.0" r="2.4" style="--s:2.61s"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:2.62s;--t:0.4s" d="M0 0 Q4 8.5 0 11.8"/><g transform="translate(0 11.8)"><path class="d pet" pathLength="1" style="--s:2.67s;--t:0.8s" d="M0 0 C-13.5 -10.1 -25.4 8.5 0 28.7 C25.4 8.5 13.5 -10.1 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.77s;--t:0.3s" d="M0 28.7 L0 38.9"/><circle class="fi dotc" cx="0" cy="41.4" r="2.4" style="--s:2.82s"/></g></g></g></g>
<text class="title" x="60" y="270" font-size="54" style="--s:3.4s">Fuchsia</text>
<text class="sub" x="64" y="315" font-size="22" style="--s:3.4s">Humble love</text>
<circle class="sp" cx="446" cy="117" r="1.5" style="animation-delay:0.0s"/>
<circle class="sp" cx="285" cy="516" r="2.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="635" cy="439" r="1.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="313" cy="148" r="2.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="567" cy="422" r="2.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="341" cy="300" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="222" cy="323" r="2.5" style="animation-delay:3.0s"/>
</svg>