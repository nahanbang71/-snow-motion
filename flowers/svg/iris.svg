<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#b48cff;--c2:#e6d6ff">
<title>Iris - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.ko{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#aab0d6;opacity:0;animation:fade 1s ease-out calc(var(--s) + 1.1s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 455 234 350 230 260"/>
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(230 190) scale(1.2)"><g transform="rotate(120.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-30 -6.2 -31.5 -40.3 -9.0 -58.9 C-3.0 -62 3.0 -62 9.0 -58.9 C31.5 -40.3 30 -6.2 0 0Z"/></g><g transform="rotate(240.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.14s;--t:0.7s" d="M0 0 C-30 -6.2 -31.5 -40.3 -9.0 -58.9 C-3.0 -62 3.0 -62 9.0 -58.9 C31.5 -40.3 30 -6.2 0 0Z"/></g><g transform="rotate(360.0) translate(0 -4)"><path class="d pet" pathLength="1" style="--s:2.28s;--t:0.7s" d="M0 0 C-30 -6.2 -31.5 -40.3 -9.0 -58.9 C-3.0 -62 3.0 -62 9.0 -58.9 C31.5 -40.3 30 -6.2 0 0Z"/></g><g transform="rotate(60.0) translate(0 -2)"><path class="d pet2" pathLength="1" style="--s:2.42s;--t:0.7s" d="M0 0 C-18 -19.8 -18 -46.2 0 -66 C18 -46.2 18 -19.8 0 0Z"/></g><g transform="rotate(180.0) translate(0 -2)"><path class="d pet2" pathLength="1" style="--s:2.56s;--t:0.7s" d="M0 0 C-18 -19.8 -18 -46.2 0 -66 C18 -46.2 18 -19.8 0 0Z"/></g><g transform="rotate(300.0) translate(0 -2)"><path class="d pet2" pathLength="1" style="--s:2.70s;--t:0.7s" d="M0 0 C-18 -19.8 -18 -46.2 0 -66 C18 -46.2 18 -19.8 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.84s;--t:0.4s" d="M6.9 4.0 L34.6 20.0"/><path class="d pet2" pathLength="1" style="--s:2.89s;--t:0.4s" d="M-6.9 4.0 L-34.6 20.0"/><path class="d pet2" pathLength="1" style="--s:2.94s;--t:0.4s" d="M-0.0 -8.0 L-0.0 -40.0"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Iris</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Good news</text>
<text class="ko" x="364" y="352" font-size="20" style="--s:3.4s">아이리스 · 기쁜 소식</text>
<circle class="sp" cx="653" cy="142" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="680" cy="264" r="2.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="578" cy="343" r="1.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="536" cy="457" r="2.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="533" cy="415" r="2" style="animation-delay:2.0s"/>
<circle class="sp" cx="394" cy="472" r="1.5" style="animation-delay:2.5s"/>
<circle class="sp" cx="619" cy="167" r="2" style="animation-delay:3.0s"/>
</svg>