<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ffb08a;--c2:#ffe0d0">
<title>Angel&#x27;s Trumpet - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;animation:fade 1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);opacity:0;animation:fade 1s ease-out calc(var(--s) + .6s) forwards}
.ko{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#aab0d6;opacity:0;animation:fade 1s ease-out calc(var(--s) + 1.1s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(0 0) scale(1.0)"><path class="d stem" pathLength="1" style="--s:0.00s;--t:2.2s" d="M230 560 C226 440 228 300 232 235 C236 175 190 130 130 150"/><g transform="translate(227.8 198.1)"><path class="d pet2" pathLength="1" style="--s:2.00s;--t:0.4s" d="M0 0 Q4 18.7 0 26.2"/><g transform="translate(0 26.2)"><path class="d pet" pathLength="1" style="--s:2.05s;--t:0.8s" d="M0 0 C-28.1 0 -31.8 37.4 -44.9 63.6 Q0 78.5 44.9 63.6 C31.8 37.4 28.1 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.15s;--t:0.4s" d="M-44.9 63.6 Q0 48.6 44.9 63.6"/></g></g><g transform="translate(195.5 155.5)"><path class="d pet2" pathLength="1" style="--s:2.20s;--t:0.4s" d="M0 0 Q4 14.9 0 20.8"/><g transform="translate(0 20.8)"><path class="d pet" pathLength="1" style="--s:2.25s;--t:0.8s" d="M0 0 C-22.3 0 -25.3 29.8 -35.7 50.6 Q0 62.5 35.7 50.6 C25.3 29.8 22.3 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.35s;--t:0.4s" d="M-35.7 50.6 Q0 38.7 35.7 50.6"/></g></g><g transform="translate(140.6 147.1)"><path class="d pet2" pathLength="1" style="--s:2.40s;--t:0.4s" d="M0 0 Q4 11.1 0 15.5"/><g transform="translate(0 15.5)"><path class="d pet" pathLength="1" style="--s:2.45s;--t:0.8s" d="M0 0 C-16.6 0 -18.8 22.1 -26.5 37.6 Q0 46.4 26.5 37.6 C18.8 22.1 16.6 0 0 0Z"/><path class="d pet2" pathLength="1" style="--s:2.55s;--t:0.4s" d="M-26.5 37.6 Q0 28.7 26.5 37.6"/></g></g></g></g>
<text class="title" x="360" y="270" font-size="40" style="--s:3.4s">Angel&#x27;s Trumpet</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Gentle heart</text>
<text class="ko" x="364" y="352" font-size="20" style="--s:3.4s">엔젤트럼펫 · 부드러운 마음</text>
<circle class="sp" cx="368" cy="405" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="578" cy="199" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="355" cy="427" r="2.5" style="animation-delay:1.0s"/>
<circle class="sp" cx="471" cy="428" r="1.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="729" cy="162" r="1.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="705" cy="330" r="2" style="animation-delay:2.5s"/>
<circle class="sp" cx="526" cy="275" r="2" style="animation-delay:3.0s"/>
</svg>