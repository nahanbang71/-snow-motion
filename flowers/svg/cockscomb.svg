<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ff3860;--c2:#ffb3c1">
<title>Cockscomb - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 452 234 343 230 250"/>
<path class="d stem" pathLength="1" style="--s:1.50s;--t:1s" d="M229 540 C190 500 160 440 150 380 C190 410 225 470 229 540"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M231 520 C270 480 300 420 312 360 C268 395 235 455 231 520"/><path class="d stem" pathLength="1" style="--s:1.90s;--t:0.8s" d="M230 470 C205 440 195 400 192 360"/>

<g transform="translate(230 190) scale(1.2)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:1.4s" d="M-58.3 -11.2 A10.0 10.0 0 0 1 -49.2 -27.7 A10.0 10.0 0 0 1 -35.6 -40.8 A10.0 10.0 0 0 1 -18.6 -49.1 A10.0 10.0 0 0 1 0.0 -52.0 A10.0 10.0 0 0 1 18.6 -49.1 A10.0 10.0 0 0 1 35.6 -40.8 A10.0 10.0 0 0 1 49.2 -27.7 A10.0 10.0 0 0 1 58.3 -11.2 L26 52 L-26 52Z"/><path class="d pet2" pathLength="1" style="--s:2.50s;--t:1s" d="M-43.2 -5.7 A9.9 9.9 0 0 1 -33.5 -21.6 A9.9 9.9 0 0 1 -18.2 -32.2 A9.9 9.9 0 0 1 0.0 -36.0 A9.9 9.9 0 0 1 18.2 -32.2 A9.9 9.9 0 0 1 33.5 -21.6 A9.9 9.9 0 0 1 43.2 -5.7"/><path class="d pet2" pathLength="1" style="--s:2.80s;--t:1s" d="M-28.2 -0.3 A9.6 9.6 0 0 1 -17.2 -14.6 A9.6 9.6 0 0 1 0.0 -20.0 A9.6 9.6 0 0 1 17.2 -14.6 A9.6 9.6 0 0 1 28.2 -0.3"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Cockscomb</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Passion</text>
<circle class="sp" cx="76" cy="348" r="2" style="animation-delay:0.0s"/>
<circle class="sp" cx="370" cy="444" r="1.5" style="animation-delay:0.5s"/>
<circle class="sp" cx="214" cy="319" r="2" style="animation-delay:1.0s"/>
<circle class="sp" cx="158" cy="398" r="1.5" style="animation-delay:1.5s"/>
<circle class="sp" cx="496" cy="376" r="1.5" style="animation-delay:2.0s"/>
<circle class="sp" cx="722" cy="401" r="2" style="animation-delay:2.5s"/>
<circle class="sp" cx="72" cy="498" r="1.5" style="animation-delay:3.0s"/>
</svg>