57.5) translate(0 -8.0)"><path class="d pet2" pathLength="1" style="--s:2.33s;--t:0.7s" d="M0 0 C-22 -16.4 -22 -38.2 0 -54.6 C22 -38.2 22 -16.4 0 0Z"/></g><g transform="rotate(202.5) translate(0 -8.0)"><path class="d pet2" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-22 -16.4 -22 -38.2 0 -54.6 C22 -38.2 22 -16.4 0 0Z"/></g><g transform="rotate(247.5) translate(0 -8.0)"><path class="d pet2" pathLength="1" style="--s:2.39s;--t:0.7s" d="M0 0 C-22 -16.4 -22 -38.2 0 -54.6 C22 -38.2 22 -16.4 0 0Z"/></g><g transform="rotate(292.5) translate(0 -8.0)"><path class="d pet2" pathLength="1" style="--s:2.42s;--t:0.7s" d="M0 0 C-22 -16.4 -22 -38.2 0 -54.6 C22 -38.2 22 -16.4 0 0Z"/></g><g transform="rotate(337.5) translate(0 -8.0)"><path class="d pet2" pathLength="1" style="--s:2.45s;--t:0.7s" d="M0 0 C-22 -16.4 -22 -38.2 0 -54.6 C22 -38.2 22 -16.4 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.48s;--t:0.7s" d="M-10 0a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"/><circle class="fi dotc" cx="1.9" cy="0.0" r="1.3" style="--s:2.55s"/><circle class="fi dotc" cx="-2.4" cy="2.2" r="1.3" style="--s:2.55s"/><circle class="fi dotc" cx="0.4" cy="-4.2" r="1.3" style="--s:2.56s"/><circle class="fi dotc" cx="3.0" cy="3.9" r="1.3" style="--s:2.56s"/><circle class="fi dotc" cx="-5.5" cy="-1.0" r="1.3" style="--s:2.57s"/><circle class="fi dotc" cx="5.2" cy="-3.3" r="1.3" style="--s:2.57s"/><circle class="fi dotc" cx="-1.8" cy="6.5" r="1.3" style="--s:2.57s"/><circle class="fi dotc" cx="-3.3" cy="-6.4" r="1.3" style="--s:2.58s"/><circle class="fi dotc" cx="7.2" cy="2.6" r="1.3" style="--s:2.58s"/><circle class="fi dotc" cx="-7.5" cy="3.1" r="1.3" style="--s:2.59s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Poinsettia</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Blessing</text>
