<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="--c:#ffe14a;--c2:#fff4b0">
<title>Adonis - neon line art</title>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#14183a"/><stop offset="1" stop-color="#080a1a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) ease-out var(--s,0s) forwards}
.stem{stroke:#3df2c0;stroke-width:3}
.pet{stroke:var(--c);stroke-width:2}
.pet2{stroke:var(--c2);stroke-width:1.6}
.rip{stroke:#5ad7ff;stroke-width:2.4}
.fi{opacity:0;animation:fade .5s ease-out var(--s,0s) forwards}
.dotc{fill:var(--c2)}
.title{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;fill:none;stroke:var(--c);stroke-width:1.6;clip-path:inset(0 100% 0 0);animation:wipe 1.1s ease-out var(--s) forwards}
.sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--c2);clip-path:inset(0 100% 0 0);animation:wipe 1s ease-out calc(var(--s) + .7s) forwards}
.sp{fill:var(--c2);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
</style>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<g filter="url(#glow)">
<path class="d stem" pathLength="1" style="--s:0.00s;--t:2s" d="M230 560 C226 453 234 347 230 256"/>
<path class="d stem" pathLength="1" style="--s:1.40s;--t:1s" d="M230 480 C190 495 158 465 152 425 C192 422 226 440 230 480Z"/><path class="d stem" pathLength="1" style="--s:1.70s;--t:1s" d="M230 440 C268 452 300 425 306 388 C266 388 234 404 230 440Z"/>

<g transform="translate(230 190) scale(1.2)"><g transform="rotate(0.0) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.00s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(25.7) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.03s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(51.4) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.06s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(77.1) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.09s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(102.9) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.12s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(128.6) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.15s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(154.3) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.18s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(180.0) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.21s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(205.7) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.24s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(231.4) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.27s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(257.1) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.30s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(282.9) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.33s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(308.6) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.36s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><g transform="rotate(334.3) translate(0 -9.6)"><path class="d pet" pathLength="1" style="--s:2.39s;--t:0.7s" d="M0 0 C-10 -15.0 -10 -35.0 0 -50.0 C10 -35.0 10 -15.0 0 0Z"/></g><path class="d pet2" pathLength="1" style="--s:2.42s;--t:0.7s" d="M-12 0a12 12 0 1 0 24 0a12 12 0 1 0 -24 0"/><circle class="fi dotc" cx="1.9" cy="0.0" r="1.3" style="--s:2.49s"/><circle class="fi dotc" cx="-2.4" cy="2.2" r="1.3" style="--s:2.49s"/><circle class="fi dotc" cx="0.4" cy="-4.2" r="1.3" style="--s:2.50s"/><circle class="fi dotc" cx="3.1" cy="4.0" r="1.3" style="--s:2.50s"/><circle class="fi dotc" cx="-5.6" cy="-1.0" r="1.3" style="--s:2.51s"/><circle class="fi dotc" cx="5.3" cy="-3.4" r="1.3" style="--s:2.51s"/><circle class="fi dotc" cx="-1.8" cy="6.6" r="1.3" style="--s:2.51s"/><circle class="fi dotc" cx="-3.4" cy="-6.5" r="1.3" style="--s:2.52s"/><circle class="fi dotc" cx="7.4" cy="2.7" r="1.3" style="--s:2.52s"/><circle class="fi dotc" cx="-7.6" cy="3.2" r="1.3" style="--s:2.53s"/><circle class="fi dotc" cx="3.7" cy="-7.9" r="1.3" style="--s:2.53s"/><circle class="fi dotc" cx="2.7" cy="8.7" r="1.3" style="--s:2.53s"/><circle class="fi dotc" cx="-8.2" cy="-4.8" r="1.3" style="--s:2.54s"/><circle class="fi dotc" cx="9.6" cy="-2.1" r="1.3" style="--s:2.54s"/></g></g>
<text class="title" x="360" y="270" font-size="54" style="--s:3.4s">Adonis</text>
<text class="sub" x="364" y="315" font-size="22" style="--s:3.4s">Eternal happiness</text>
